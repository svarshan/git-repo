name: MoOLVa — Silero test voices (five neural speakers)
on:
  pull_request:
    paths:
      - "moolva_govorim_voice_sandbox/**"
      - ".github/workflows/moolva-voice-silero-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TTS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy omegaconf
      - name: Generate real Silero test voices
        run: python moolva_govorim_voice_sandbox/generate.py
      - name: Upload resulting HTML or report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Silero-REAL-5-voices
          path: moolva_govorim_voice_sandbox/output/
          if-no-files-found: error
