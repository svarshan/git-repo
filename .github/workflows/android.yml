name: Build MoOLVa Kino APK (encrypted)
on:
  push:
    branches: [moolva-kino-android-tv]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check TMDB key and connection
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          key = os.environ.get("TMDB_API_KEY", "")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", key):
              print("TMDB_API_KEY is missing or is not a 32-character v3 API key.")
              sys.exit(1)
          try:
              url = "https://api.themoviedb.org/3/movie/popular?language=ru-RU&api_key=" + key
              with urllib.request.urlopen(url, timeout=20) as response:
                  data = json.load(response)
              if not isinstance(data.get("results"), list):
                  raise ValueError("Unexpected response")
              print("TMDB returned a valid movie catalogue.")
          except urllib.error.HTTPError as error:
              print("TMDB request failed with HTTP status", error.code)
              sys.exit(1)
          except Exception:
              print("TMDB request failed: network error or unexpected response.")
              sys.exit(1)
          PY
      - name: Test TorrServer API contract
        shell: bash
        run: |
          curl -fsSL --retry 3 https://github.com/YouROK/TorrServer/releases/download/MatriX.148/TorrServer-linux-amd64 -o "$RUNNER_TEMP/torrserver"
          echo "050fa49b90fb47a7a60dbbbaee96de6e072701b996b1f23eb3e3dc67d723fac1  $RUNNER_TEMP/torrserver" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/torrserver"
          TORRSERVER_BIN="$RUNNER_TEMP/torrserver" python3 tests/torrserver_smoke.py
      - name: Assemble and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Encrypt and test archive
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/MoOLVa-Kino-1.2.apk"
          cd "$RUNNER_TEMP"
          7z a -t7z -mhe=on "-p$TMDB_API_KEY" MoOLVa-Kino-1.2.7z MoOLVa-Kino-1.2.apk >/dev/null
          7z t "-p$TMDB_API_KEY" MoOLVa-Kino-1.2.7z >/dev/null
          rm -f MoOLVa-Kino-1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Kino-1.2-encrypted
          path: ${{ runner.temp }}/MoOLVa-Kino-1.2.7z
          if-no-files-found: error

