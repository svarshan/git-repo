name: Build MoOLVa HACCP Easy 1.8.0 Russian Professional Control

on:
  push:
    branches:
      - moolva-haccp-easy-1.8-professional-control
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack verified source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "moolva-haccp-easy-1.3.1/source.zip")) { throw "source.zip is missing" }
          Expand-Archive "moolva-haccp-easy-1.3.1/source.zip" -DestinationPath "src" -Force
          (Get-Content "src/easy_app.py" -Raw).Replace("1.3.0","1.3.1") | Set-Content "src/easy_app.py" -Encoding UTF8
          "1.3.1" | Set-Content "src/.moolva_easy_version" -Encoding ASCII
          Expand-Archive "moolva-haccp-easy-1.4/delta.zip" -DestinationPath "src" -Force
          $digest=(Get-FileHash "moolva-haccp-easy-1.4/delta.zip" -Algorithm SHA256).Hash.ToLower()
          if($digest -ne "0f050c73bbe2bbdc31f0ba56beeaaf3e7729c8210250bbb826bc7c27efb1a01f"){ throw "Delta integrity check failed" }
          "1.4.0" | Set-Content "src/.moolva_easy_version" -Encoding ASCII
          $patch = "moolva-haccp-easy-1.5/delta.zip"
          if (!(Test-Path $patch)) { throw "MoOLVa Easy 1.5 patch missing" }
          $digest15=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLower()
          if($digest15 -ne "c33cd54d0528b991d4d3132b2ca2626b2907759740b1ba27be14b9ee95134725"){ throw "MoOLVa Easy 1.5 patch integrity failure" }
          Expand-Archive $patch -DestinationPath "src" -Force
          "1.5.0" | Set-Content "src/.moolva_easy_version" -Encoding ASCII
          $patch16 = "moolva-haccp-easy-1.6/delta.zip"
          if (!(Test-Path $patch16)) { throw "MoOLVa Easy 1.6 patch missing" }
          $digest16=(Get-FileHash $patch16 -Algorithm SHA256).Hash.ToLower()
          if($digest16 -ne "0245496817edab225423991a60f2d79338e192e50407bf611692793d50983d8d"){ throw "MoOLVa Easy 1.6 patch integrity failure" }
          Expand-Archive $patch16 -DestinationPath "src" -Force
          "1.6.0" | Set-Content "src/.moolva_easy_version" -Encoding ASCII
          $patch17 = "moolva-haccp-easy-1.7/delta.zip"
          if (!(Test-Path $patch17)) { throw "Missing MoOLVa Easy 1.7" }
          $hash17=(Get-FileHash $patch17 -Algorithm SHA256).Hash.ToLower()
          if ($hash17 -ne "c1b3b98b188bc3271651c7cf328efb1f0285620895d60dc52c0100520db952fb") { throw "1.7 source hash mismatch" }
          Expand-Archive $patch17 -DestinationPath "src" -Force
          "1.7.0" | Set-Content "src/.moolva_easy_version" -Encoding ASCII
          $patch18 = "moolva-haccp-easy-1.8/delta.zip"
          if (!(Test-Path $patch18)) { throw "Missing MoOLVa Easy 1.8" }
          $hash18=(Get-FileHash $patch18 -Algorithm SHA256).Hash.ToLower()
          if ($hash18 -ne "25a7a52d6dd72860d49efde2ad8b02ae6439dd74887379ff81d2298ab9b03044") { throw "1.8 source hash mismatch" }
          Expand-Archive $patch18 -DestinationPath "src" -Force
          "1.8.0" | Set-Content "src/.moolva_easy_version" -Encoding ASCII

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Run source self-test
        shell: pwsh
        working-directory: src
        run: |
          python easy_app.py --self-test
          python -m unittest discover -s tests -p "test_*.py" -q

      - name: Build autonomous Portable EXE
        shell: pwsh
        working-directory: src
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "MoOLVa_HACCP_Easy_1.8.0_Portable" --icon "assets/MoOLVa_HACCP.ico" --add-data "assets;assets" --collect-all docx --collect-all reportlab --collect-all PIL easy_app.py

      - name: Test frozen Portable EXE
        shell: pwsh
        working-directory: src
        run: |
          $exe = ".\dist\MoOLVa_HACCP_Easy_1.8.0_Portable.exe"
          if (!(Test-Path $exe)) { throw "Portable EXE was not created" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen EXE self-test failed with exit code $($p.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build real Russian-language installer with required licence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iss = Get-Content "src/installer.iss" -Raw -Encoding UTF8
          if ($iss -notmatch "LicenseFile=LICENSE_RU.txt" -or $iss -notmatch 'Russian.isl') { throw "Russian EULA not mandatory" }
          if (!(Test-Path "src/LICENSE_RU.txt")) { throw "Russian licence missing" }
          Push-Location src
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          Pop-Location
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "src/release/MoOLVa_HACCP_Easy_1.8.0_Setup.exe" "release/MoOLVa_HACCP_Easy_1.8.0_Setup.exe"

      - name: Install real 1.7 and seed old user records
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path previous | Out-Null
          gh run download 37944302823 --repo svarshan/git-repo --name MoOLVa_HACCP_Easy_1.7.0_Autonomous_Windows --dir previous
          if ($LASTEXITCODE -ne 0) { throw "Could not download 1.6 installer" }
          $old = (Resolve-Path "previous/MoOLVa_HACCP_Easy_1.7.0_Setup.exe").Path
          $o=Start-Process -FilePath $old -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -PassThru -Wait
          if ($o.ExitCode -ne 0) { throw "Previous version could not be installed" }
          $seed=@'
          import os
          from pathlib import Path
          from storage import Store
          st=Store()
          vid=st.create_venue('Столовая')
          st.update_venue(vid, {'venue_name':'Тест обновления 1.7', 'legal_name':'Тестовая организация', 'address':'Адрес испытания', 'responsible':'Технолог'})
          st.add_record(vid,'upgrade_sentinel',{'value':'OLD_1_7_DATA_MUST_SURVIVE'})
          (Path(os.environ['TEMP'])/'moolva-upgrade-venue-id.txt').write_text(str(vid),encoding='ascii')
          print('Seeded pre-upgrade venue id:',vid)
          '@
          $seed | Set-Content src/seed_previous.py -Encoding UTF8
          python src/seed_previous.py

      - name: Test real installer on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "release\MoOLVa_HACCP_Easy_1.8.0_Setup.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MoOLVaHACCPEasy"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/TASKS=!desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup installation failed with exit code $($p.ExitCode)" }
          $installed = Join-Path $installDir "MoOLVa_HACCP_Easy.exe"
          if (!(Test-Path $installed)) { throw "Installed EXE not found: $installed" }
          $t = Start-Process -FilePath $installed -ArgumentList "--self-test" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed EXE self-test failed with exit code $($t.ExitCode)" }
          $verify=@'
          import os
          from pathlib import Path
          from storage import Store
          from mature17_core import upgrade_safety_backup,mark_upgrade_success
          from mature18_core import migrate18
          st=Store()
          backup=upgrade_safety_backup(st,version_tag='1.8.0')
          if backup is None or not backup.exists():raise SystemExit('Upgrade backup missing')
          migrate18(st)
          mark_upgrade_success(st,backup,version_tag='1.8.0')
          vid=int((Path(os.environ['TEMP'])/'moolva-upgrade-venue-id.txt').read_text())
          rows=st.list_records(vid,'upgrade_sentinel')
          if len(rows)!=1 or rows[0]['data']['value']!='OLD_1_6_DATA_MUST_SURVIVE':
              raise SystemExit('Existing user data lost during upgrade')
          assert st.get_venue(vid)['venue_name']=='Тест обновления 1.6'
          print('Upgrade from 1.7 to 1.8: original user DB retained, backup verified, schema migrated')
          '@
          $verify | Set-Content src/verify_upgrade.py -Encoding UTF8
          Push-Location src
          python verify_upgrade.py
          if ($LASTEXITCODE -ne 0) { throw "1.7 -> 1.8 upgrade data test failed" }
          Pop-Location
          $uninstall = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstall)) { throw "Uninstaller was not created" }
          $u = Start-Process -FilePath $uninstall -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall test failed with exit code $($u.ExitCode)" }


      - name: Prepare Windows release and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item "src/dist/MoOLVa_HACCP_Easy_1.8.0_Portable.exe" "release/MoOLVa_HACCP_Easy_1.8.0_Portable.exe"
          $lines = @()
          Get-ChildItem "release/*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          if ($lines.Count -ne 2) { throw "Expected exactly two EXE files" }
          $lines | Set-Content "release/SHA256SUMS.txt" -Encoding ASCII
          Get-Content "release/SHA256SUMS.txt"

      - name: Upload autonomous Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MoOLVa_HACCP_Easy_1.8.0_Autonomous_Windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
