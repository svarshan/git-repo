name: MoOLVa Mahjong 3.1.3 Cinematic Fix 3D — Android Studio & Emulator
on:
  push:
    branches: [moolva-mahjong-3.1.3-cinematic-fix]
    paths: ['mahjong313/**','.github/workflows/moolva-mahjong-313-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source archive & import new versioned project
        run: |
          set -euo pipefail
          mkdir -p mahjong310/project
          cat mahjong310/source.part* | base64 -d >/tmp/moolva310.tar.gz
          echo 'a1411bda692d6b177943725c8bc96a84f140961a29e15862964b532a185aa481  /tmp/moolva310.tar.gz' | sha256sum -c -
          tar -xzf /tmp/moolva310.tar.gz -C mahjong310/project
          python3 mahjong311/patch.py mahjong310/project
          python3 mahjong312/patch.py mahjong310/project
          python3 mahjong313/patch.py mahjong310/project
          test -f mahjong310/project/app/src/main/java/com/moolva/mahjong/Board3DView.java
          test -f mahjong310/project/START_HERE_SDK_SETUP.cmd
          jar tf mahjong310/project/gradle/wrapper/gradle-wrapper.jar | grep -q org/gradle/wrapper/WrapperExecutor.class
      - name: Install SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run existing engine regression tests
        working-directory: mahjong310/project
        run: bash tests/run-tests.sh
      - name: Build real GLES Android app and lint
        working-directory: mahjong310/project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Verify Android package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging mahjong310/project/app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='3.1.3'"
      - name: Package source only with a new folder
        run: |
          set -euo pipefail
          mkdir -p mahjong310/dist/MoOLVaMahjong_Ultimate_3_1_3_CinematicFix
          rsync -a --exclude=local.properties --exclude=.gradle --exclude=out --exclude=build \
            mahjong310/project/ mahjong310/dist/MoOLVaMahjong_Ultimate_3_1_3_CinematicFix/
          cd mahjong310/dist
          zip -qr ../MoOLVa_Mahjong_3.1.3_CinematicFix_AndroidStudio.zip MoOLVaMahjong_Ultimate_3_1_3_CinematicFix
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Mahjong-3.1.3-CinematicFix-AndroidStudio
          path: mahjong310/MoOLVa_Mahjong_3.1.3_CinematicFix_AndroidStudio.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 3DReborn-313-emulator-only-apk
          path: mahjong310/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
  screenshot:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: 3DReborn-emulator-only-apk
          path: ./apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Launch 3D app and capture actual game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            adb install apk/app-debug.apk
            adb shell am start -n com.moolva.mahjong/.MainActivity --ez visual_preview true
            sleep 6
            adb shell am start -n com.moolva.mahjong/.MainActivity --ez visual_preview true
            sleep 4
            adb shell screencap -p /sdcard/MoOLVa_3DReborn_actual.png
            adb pull /sdcard/MoOLVa_3DReborn_actual.png MoOLVa_3DReborn_actual.png
            adb logcat -d -s AndroidRuntime:E OpenGLRenderer:E > MoOLVa_3DReborn_logcat.txt
            if grep -q 'FATAL EXCEPTION' MoOLVa_3DReborn_logcat.txt; then cat MoOLVa_3DReborn_logcat.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-3.1.3-CinematicFix-Real-Emulator-Screenshot
          path: |
            MoOLVa_3DReborn_actual.png
            MoOLVa_3DReborn_logcat.txt
          if-no-files-found: error
          retention-days: 30
