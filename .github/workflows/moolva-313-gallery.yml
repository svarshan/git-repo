name: MoOLVa 3.1.3 — Screens from App
on:
  push:
    branches: [moolva-mahjong-3.1.3-cinematic-fix]
    paths: ['.github/workflows/moolva-313-gallery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: 3DReborn-313-emulator-only-apk
          run-id: 38157156000
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./apk
      - name: KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture gameplay and menus on real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            set -e
            mkdir -p gallery
            adb install apk/app-debug.apk
            adb shell am start -n com.moolva.mahjong/.MainActivity
            sleep 6
            adb exec-out screencap -p >gallery/01_home.png
            adb shell input tap 540 2060
            sleep 2
            adb exec-out screencap -p >gallery/02_themes.png
            adb shell input keyevent 4
            sleep 1
            adb shell input tap 540 1890
            sleep 2
            adb exec-out screencap -p >gallery/03_worlds.png
            adb shell input tap 540 705
            sleep 1
            adb exec-out screencap -p >gallery/04_levels.png
            adb shell input tap 146 850
            sleep 2
            adb exec-out screencap -p >gallery/05_game.png
            adb shell input keyevent 4
            sleep 1
            adb shell input tap 945 424
            sleep 2
            adb exec-out screencap -p >gallery/06_settings.png
            adb logcat -d -s AndroidRuntime:E >gallery/android_errors.txt
            if grep -q 'FATAL EXCEPTION' gallery/android_errors.txt; then cat gallery/android_errors.txt; exit 1; fi
            file gallery/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-313-Real-App-Screen-Gallery
          path: gallery/
          if-no-files-found: error
          retention-days: 30
