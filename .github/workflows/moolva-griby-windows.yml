name: MoOLVa Griby 5.0.0 Regional Encyclopedia - Windows Portable
on:
  push:
    branches: [feature/moolva-griby-5.0]
    paths: ['MoOLVaGriby/**', '.github/workflows/moolva-griby-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: griby-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: MoOLVaGriby
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse verified 4.1.0 build data when available
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45222764791 --name griby34-build-data --dir bundle
          test -s bundle/maps/nizhny-novgorod.pmtiles
          test -s bundle/offline-localities.js
          test -s bundle/build/moolva-griby.ico
      - name: Prepare the map overview and six downloadable packs
        if: steps.reuse.outcome != 'success'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/griby-tools" bundle/maps
          curl -fL --retry 3 https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP/griby-tools"
          python3 scripts/build-map-packs.py --pmtiles "$RUNNER_TEMP/griby-tools/pmtiles" --seed "$RUNNER_TEMP/griby-tools/region.pmtiles" --details "$RUNNER_TEMP/griby-tools/packs" --overview bundle/maps/nizhny-novgorod.pmtiles
          node scripts/offline-localities.mjs "$RUNNER_TEMP/griby-tools/region.pmtiles" bundle/offline-localities.js
      - name: Recover attributed media from the verified 3.3 release
        if: steps.reuse.outcome != 'success'
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/griby-tools/griby33.exe" https://github.com/svarshan/git-repo/releases/download/v3.3.0/MoOLVa-Griby-3.3-Portable-x64.exe
          printf '%s  %s\n' 66410440453aa0f170e069e8c074f5fa834d7cfe026075dae279f57efe27fa6d "$RUNNER_TEMP/griby-tools/griby33.exe" | sha256sum -c -
          unpack=node_modules/7zip-bin/linux/x64/7za
          chmod +x "$unpack"
          status=0
          "$unpack" e -y "-o$RUNNER_TEMP/griby-tools" "$RUNNER_TEMP/griby-tools/griby33.exe" resources/app.asar || status=$?
          test "$status" -le 1
          node node_modules/@electron/asar/bin/asar.js extract "$RUNNER_TEMP/griby-tools/app.asar" "$RUNNER_TEMP/griby-tools/griby33-app"
          cp -a "$RUNNER_TEMP/griby-tools/griby33-app/"{media,build,photos.js,photos-gallery20.js,region20.js} bundle/
      - name: Bundle the full zoom 5–14 regional map
        run: |
          set -euo pipefail
          if [ "$(od -An -tu1 -j101 -N1 bundle/maps/nizhny-novgorod.pmtiles 2>/dev/null | tr -d ' ')" = 14 ]; then exit 0; fi
          tools_dir="$RUNNER_TEMP/griby-tools"
          mkdir -p "$tools_dir"
          if [ ! -s "$tools_dir/region.pmtiles" ]; then
            curl -fL --retry 3 https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar -xz -C "$tools_dir"
            "$tools_dir/pmtiles" extract https://build.protomaps.com/20261116.pmtiles "$tools_dir/region.pmtiles" --bbox=41.55,54.38,47.85,58.22 --minzoom=5 --maxzoom=14
          fi
          "$tools_dir/pmtiles" verify "$tools_dir/region.pmtiles"
          cp "$tools_dir/region.pmtiles" bundle/maps/nizhny-novgorod.pmtiles
      - uses: actions/upload-artifact@v4
        with:
          name: griby34-build-data
          path: MoOLVaGriby/bundle/
          retention-days: 7
  windows:
    needs: data
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: MoOLVaGriby
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: griby34-build-data
          path: MoOLVaGriby/bundle
      - name: Build the x64 Portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '9'
        run: |
          Copy-Item -Path bundle/* -Destination . -Recurse -Force
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win portable --x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the Portable EXE in a fresh Windows profile
        timeout-minutes: 4
        run: |
          $exe = (Resolve-Path 'dist/MoOLVa-Griby-5.0.0-Full-Portable-x64.exe').Path
          $dir = Join-Path (Get-Location).Path 'dist/evidence'
          $proc = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @("`"--moolva-evidence-dir=$dir`"")
          if ($proc.ExitCode -ne 0) { Get-Content "$dir/gui-error.txt" -ErrorAction SilentlyContinue; throw "Portable exited with $($proc.ExitCode)" }
          if (-not (Test-Path "$dir/11-smart-atlas.json")) { throw 'Missing Smart Atlas verification' }
          if (-not (Test-Path "$dir/11-smart-atlas.png")) { throw 'Missing Smart Atlas screenshot' }
          if (-not (Test-Path "$dir/09-offline-map.json")) { throw 'Missing offline map verification' }
          if (-not (Test-Path "$dir/07-free-interactive-map.png")) { throw 'Missing interactive map screenshot' }
          if (-not (Test-Path "$dir/08-visible-map-menu.png")) { throw 'Missing Windows screenshot' }
          if (-not (Test-Path 'dist/MoOLVa-Griby-Data/Local Storage')) { throw 'Portable profile missing next to EXE' }
          if (-not (Test-Path "$dir/14-encyclopedia.json")) { throw 'Missing encyclopedia verification' }
          if (-not (Test-Path "$dir/12-map-fallback.json")) { throw 'Missing partial tile fallback verification' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 'dist/SHA256.txt'
      - name: Upgrade a real 4.1.0 Portable profile and recover damaged data
        timeout-minutes: 8
        run: |
          $exe = (Resolve-Path 'dist/MoOLVa-Griby-5.0.0-Full-Portable-x64.exe').Path
          $evidence = (Resolve-Path 'dist/evidence').Path
          $case = Join-Path $env:RUNNER_TEMP 'Профиль атласа'
          New-Item -ItemType Directory -Force $case | Out-Null
          $previous = Join-Path $case 'MoOLVa-Griby-4.1.0.exe'
          $candidate = Join-Path $case 'MoOLVa-Griby-5.0.0.exe'
          curl.exe -fLsS --retry 2 -o $previous https://github.com/svarshan/git-repo/releases/download/griby-v4.1.0-full/MoOLVa-Griby-4.1.0-Full-Portable-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed' }
          if ((Get-FileHash $previous -Algorithm SHA256).Hash -ne '1651A40BA1E08FE59FBA17D7644A1BABE79E3A17528905FC5D0F62CE09CA223C') { throw 'Previous release hash mismatch' }
          Copy-Item $exe $candidate
          function Run-Atlas($file, $out, $extra) {
            $arguments = @("`"--moolva-evidence-dir=$out`"")
            if ($extra) { $arguments += "--moolva-profile-check=$extra" }
            $proc = Start-Process -FilePath $file -PassThru -Wait -ArgumentList $arguments
            if ($proc.ExitCode -ne 0) { Get-Content "$out/gui-error.txt" -ErrorAction SilentlyContinue; throw "Portable exited with $($proc.ExitCode)" }
          }
          Run-Atlas $previous (Join-Path $case 'legacy-qa') ''
          Run-Atlas $candidate $evidence 'upgrade'
          $profile = Join-Path $case 'MoOLVa-Griby-Data'
          $backup = Join-Path $profile 'Backups'
          $checkpoint = Get-Content (Join-Path $backup 'before-5.0.json') -Raw | ConvertFrom-Json
          if ($checkpoint.values.'moolva-map-mode' -ne 'online') { throw 'Missing legacy map setting in checkpoint' }
          $snapshots = @(Get-ChildItem $backup -Filter 'snapshot-*.json' | Sort-Object Name -Descending)
          if ($snapshots.Count -lt 3) { throw 'Missing rolling snapshots' }
          Set-Content -LiteralPath $snapshots[0].FullName -Value 'broken'
          Rename-Item -LiteralPath (Join-Path $profile 'Local Storage') -NewName 'Local Storage damaged'
          Run-Atlas $candidate $evidence 'recover'
          if (-not (Test-Path "$evidence/13-profile.json")) { throw 'Missing profile recovery evidence' }
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Griby-5.0.0-Full-Portable-x64
          path: MoOLVaGriby/dist/MoOLVa-Griby-5.0.0-Full-Portable-x64.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MoOLVa-Griby-5.0.0-Windows-QA
          path: |
            MoOLVaGriby/dist/evidence/
            MoOLVaGriby/dist/SHA256.txt

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: MoOLVa-Griby-5.0.0-Full-Portable-x64
          path: current
      - uses: actions/download-artifact@v4
        with:
          name: MoOLVa-Griby-5.0.0-Windows-QA
          path: qa
      - name: Publish the Windows-tested full EXE
        run: |
          set -euo pipefail
          tag=griby-v5.0.0-full
          exe=current/MoOLVa-Griby-5.0.0-Full-Portable-x64.exe
          node -e 'const data=require("./MoOLVaGriby/atlas50-data.js"); const atlas=require("./MoOLVaGriby/atlas50.js"); process.stdout.write(JSON.stringify(atlas.validate(data),null,2)+"\n");' > MoOLVa-Griby-Atlas-Package.json
          digest=$(sha256sum "$exe" | cut -d' ' -f1)
          grep -qi "$digest" qa/SHA256.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          else
            gh release create "$tag" "$exe" MoOLVa-Griby-Atlas-Package.json qa/evidence/14-encyclopedia.png qa/evidence/14-encyclopedia.json qa/evidence/13-profile.json qa/SHA256.txt --target "$GITHUB_SHA" --latest=false --title 'MoOLVa Грибы 5.0.0 «Региональная энциклопедия» Portable' --notes 'Группы двойников, объяснения определителя, региональные источники, тренажёр и отдельный пакет данных. Portable для Windows x64.'
          fi
