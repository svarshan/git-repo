name: Инвентаризация Маяк 2.3 — Умная столовая — Excel и тест запуска
on:
  push:
    branches:
      - inventarizatsiya-v1
    paths:
      - "Inventarizatsiya/**"
      - ".github/workflows/inventarizatsiya-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Проверить запуск, собрать EXE и установщик
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Скачать исходники
        uses: actions/checkout@v4

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Распаковать исходный проект
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "Inventarizatsiya/source.zip" -DestinationPath "." -Force
          if (-not (Test-Path "Inventarizatsiya/Inventarizatsiya.csproj")) {
            throw "Не найден проект Inventarizatsiya.csproj"
          }

      - name: Сборка EXE (Windows x64)
        shell: pwsh
        run: |
          dotnet publish "Inventarizatsiya/Inventarizatsiya.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "Inventarizatsiya/dist/portable"
          if ($LASTEXITCODE -ne 0) { throw "Ошибка dotnet publish" }
          if (-not (Test-Path "Inventarizatsiya/dist/portable/Inventarizatsiya.exe")) { throw "EXE не создан" }

      - name: Проверить запуск и каждую вкладку WPF
        shell: pwsh
        run: |
          $exe = (Resolve-Path "Inventarizatsiya/dist/portable/Inventarizatsiya.exe").Path
          $log = Join-Path $env:RUNNER_TEMP "inventarizatsiya-smoke-test.log"
          $env:INVENTARIZATSIYA_DIAGNOSTIC_LOG = $log
          $env:INVENTARIZATSIYA_SCREENSHOT = Join-Path $env:RUNNER_TEMP "mayak22_real_window.png"
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Host "Smoke-test #$attempt : запуск $exe"
            $proc = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
            if (-not $proc.WaitForExit(90000)) {
              $proc.Kill()
              throw "WPF-приложение не завершило smoke-test за 90 секунд"
            }
            Write-Host "Код завершения: $($proc.ExitCode)"
            if (Test-Path $log) {
              Get-Content -LiteralPath $log | Select-Object -Last 160 | Write-Host
            }
            if ($proc.ExitCode -ne 0) { throw "Ошибка запуска WPF: см. журнал выше" }
          }
          Write-Host "OK: обе проверки открытия окна и вкладок пройдены"

      - name: Реальный скриншот WPF (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Mayak_2.3_UmnayaStolovaya_Real_Windows_Screenshot
          path: ${{ runner.temp }}/mayak22_real_window.png
          if-no-files-found: error
          retention-days: 30

      - name: Опубликовать готовый EXE
        uses: actions/upload-artifact@v4
        with:
          name: Inventarizatsiya_2.3.0_EXE_win-x64
          path: Inventarizatsiya/dist/portable/*
          if-no-files-found: error
          retention-days: 30

      - name: Установить Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Не удалось установить Inno Setup" }

      - name: Собрать установщик 2.3.0
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Не найден ISCC.exe" }
          & $compiler "Inventarizatsiya/Scripts/Installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Ошибка компиляции установщика" }

      - name: Опубликовать установщик
        uses: actions/upload-artifact@v4
        with:
          name: Inventarizatsiya_2.3.0_Setup_win-x64
          path: Inventarizatsiya/dist/installer/*.exe
          if-no-files-found: error
          retention-days: 30
