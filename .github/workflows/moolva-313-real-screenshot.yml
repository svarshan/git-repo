name: MoOLVa 3.1.3 — Actual Emulator Screenshot
on:
  push:
    branches: [moolva-mahjong-3.1.3-cinematic-fix]
    paths: ['.github/workflows/moolva-313-real-screenshot.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: 3DReborn-313-emulator-only-apk
          run-id: 38157156000
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./apk
      - name: KVM permission
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Launch and screenshot the running actual application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            adb install apk/app-debug.apk
            adb shell am start -n com.moolva.mahjong/.MainActivity --ez visual_preview true
            sleep 7
            adb shell screencap -p /sdcard/MoOLVa_313_real.png
            adb pull /sdcard/MoOLVa_313_real.png MoOLVa_313_real.png
            adb logcat -d -s AndroidRuntime:E OpenGLRenderer:E > MoOLVa_313_log.txt
            if grep -q 'FATAL EXCEPTION' MoOLVa_313_log.txt; then cat MoOLVa_313_log.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-3.1.3-Actual-Emulator-Screenshot
          path: |
            MoOLVa_313_real.png
            MoOLVa_313_log.txt
          retention-days: 30
          if-no-files-found: error
