name: MoOLVa photo candidates review
on:
  workflow_dispatch:
  push:
    branches: [feature/ptitsy-8.6-pro-max]
    paths: [.github/workflows/ptitsy-photo-candidates.yml]
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Download exact taxon source images for visual review
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,time,os
          from PIL import Image,ImageOps,ImageDraw
          from io import BytesIO
          photos={
          'Limosa limosa':'Limosa limosa (calling).jpg',
          'Gallinula chloropus':'Gallinula chloropus 109736904.jpg',
          'Calidris ferruginea':'Calidris ferruginea, winter adult, Pak Thale.jpg',
          'Circus macrourus':'Circus macrourus roosting in little rann of kutch.JPG',
          'Phasianus colchicus':'Phasianus colchicus -Netherlands-8a.jpg',
          'Hydroprogne caspia':'Hydroprogne caspia in flight.jpg',
          'Melanitta nigra':'Melanitta nigra 278393468.jpg',
          'Melanitta fusca':'Melanitta fusca 1.jpg',
          'Tetrax tetrax':'Tetrax tetrax, Castuera, Estremadura, Spain 1.jpg',
          'Lyrurus tetrix':'Lyrurus tetrix in Larix sibirica Mongolia.jpg',
          'Locustella fluviatilis':'Locustella fluviatilis 123791068.jpg'}
          os.makedirs('candidates',exist_ok=True)
          session=requests.Session()
          session.headers.update({'User-Agent':'MoOLVaBirdAtlas/8.6 (species photo review; github.com/svarshan/git-repo)'})
          report=[]
          for latin,title in photos.items():
           result={'latin':latin,'title':title}
           for attempt in range(5):
            try:
             r=session.get('https://commons.wikimedia.org/w/api.php',params={'action':'query','format':'json','formatversion':2,'titles':'File:'+title,'prop':'imageinfo','iiprop':'url|size|mime|extmetadata','iiurlwidth':800},timeout=35);r.raise_for_status()
             page=r.json()['query']['pages'][0]
             info=page['imageinfo'][0]; meta=info['extmetadata']
             url=info.get('thumburl',info['url'])
             data=session.get(url,timeout=40);data.raise_for_status()
             image=Image.open(BytesIO(data.content));image.load()
             image=ImageOps.exif_transpose(image).convert('RGB')
             name=latin.replace(' ','_')+'.jpg';image.save('candidates/'+name,quality=90)
             result.update({'file':name,'source':info.get('descriptionurl'),'license':meta.get('LicenseShortName',{}).get('value',''),'licenseUrl':meta.get('LicenseUrl',{}).get('value',''),'author':meta.get('Artist',{}).get('value',''),'size':image.size})
             break
            except Exception as e:
             result['error']=type(e).__name__+': '+str(e)[:160]
             time.sleep(2*(attempt+1))
           if 'file' in result: result.pop('error',None)
           report.append(result);print(latin, 'OK' if 'file' in result else result['error'],flush=True)
          open('candidates/report.json','w',encoding='utf8').write(json.dumps(report,ensure_ascii=False,indent=2))
          sheet=Image.new('RGB',(1200,((len(photos)+2)//3)*310),'white');d=ImageDraw.Draw(sheet)
          for i,item in enumerate(report):
           x=(i%3)*400;y=(i//3)*310
           if item.get('file'):
            img=Image.open('candidates/'+item['file']);img.thumbnail((390,270));sheet.paste(img,(x+(400-img.width)//2,y))
           d.text((x+5,y+275),item['latin']+(' MISSING' if not item.get('file') else ''),fill='black')
          sheet.save('candidates/contact.jpg',quality=90)
          if any('file' not in x for x in report):raise SystemExit('Some photos could not be downloaded')
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ptitsy-photo-candidates
          path: candidates/
          retention-days: 30
