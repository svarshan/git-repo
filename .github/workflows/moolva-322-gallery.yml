name: MoOLVa Mahjong 3.2.2 — Real Multi-screen Gallery
on:
  push:
    branches: [moolva-mahjong-3.2.2-premium-porcelain]
    paths: ['.github/workflows/moolva-322-gallery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: moolva322-emulator-only-apk
          run-id: 38161370321
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./apk
      - name: Allow emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture premium themes and world screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            mkdir -p gallery
            adb install apk/app-debug.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am start -n com.moolva.mahjong/.MainActivity
            sleep 5
            adb shell input tap 275 1045
            sleep 3
            adb exec-out screencap -p > gallery/01_home.png
            adb shell input tap 540 2070
            sleep 3
            adb exec-out screencap -p > gallery/02_theme_collection.png
            adb shell input keyevent 4
            sleep 2
            adb shell input tap 540 1820
            sleep 2
            adb exec-out screencap -p > gallery/03_worlds.png
            adb shell am force-stop com.moolva.mahjong
            adb shell am start -n com.moolva.mahjong/.MainActivity --ez visual_preview true
            sleep 5
            adb shell input tap 275 1045
            sleep 2
            adb exec-out screencap -p > gallery/04_premium_game.png
            sha256sum gallery/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-3.2.2-Real-Game-Gallery
          path: gallery/
          if-no-files-found: error
          retention-days: 30
