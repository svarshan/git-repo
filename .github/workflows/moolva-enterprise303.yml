name: MoOLVa HACCP Easy 3.0.3 Bulk PDF Journals Windows

on:
  push:
    branches: [moolva-enterprise-303]
    paths: ['moolva240/**', 'moolva260/**', 'moolva300/**', 'moolva301/**', 'moolva302/**', 'moolva303/**', '.github/workflows/moolva-enterprise303.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build-and-test:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify Windows backup patch self-tests
        shell: pwsh
        run: |
          python -m unittest discover -s moolva240 -p 'test_windows_backup_patch.py' -v
          if($LASTEXITCODE -ne 0){throw 'Backup patch self-tests failed'}

      - name: Restore 2.2.1 native baseline
        shell: pwsh
        run: |
          $content=(Get-Content 'moolva-native-221/source/moolva_core_source.zip.b64' -Raw).Trim()
          $archive=Join-Path $env:RUNNER_TEMP 'baseline.zip'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($content))
          New-Item -ItemType Directory -Force 'moolva_src' | Out-Null
          Expand-Archive -Path $archive -DestinationPath 'moolva_src' -Force
          if(-not (Test-Path 'moolva_src/web19_bridge.py')){throw 'Missing native baseline'}

      - name: Apply 2.2.2 tested onboarding and 2.3 upgrades
        shell: pwsh
        run: |
          python moolva222/apply222.py moolva_src
          if($LASTEXITCODE -ne 0){throw 'Cannot restore 2.2.2 guided company setup'}
          $encoded=(Get-Content 'moolva230/moolva230_patch.zip.b64' -Raw).Trim()
          $archive=Join-Path $env:RUNNER_TEMP 'mo230overlay.zip'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($encoded))
          Expand-Archive -Path $archive -DestinationPath 'moolva_src' -Force
          foreach($path in @('moolva_src/enterprise23.py','moolva_src/tests/test_enterprise23.py','moolva_src/native221/Desktop/MoOLVaDesktop.csproj')) {
            if(-not (Test-Path $path)){throw "Missing 2.3 overlay: $path"}
          }

      - name: Apply MoOLVa 2.4 control overlay
        shell: pwsh
        run: |
          $encoded=(Get-Content 'moolva240/moolva240_overlay.zip.b64' -Raw).Trim()
          $archive=Join-Path $env:RUNNER_TEMP 'moolva24patch.zip'
          [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String($encoded))
          Expand-Archive -Path $archive -DestinationPath 'moolva_src' -Force
          python moolva240/fix_windows_backup.py moolva_src
          if($LASTEXITCODE -ne 0){throw 'Windows backup fix failed'}
          foreach($p in @('moolva_src/intelligent24.py','moolva_src/tests/test_intelligent24.py','moolva_src/web19/index.html')){
            if(-not (Test-Path $p)){throw "Missing 2.4 component: $p"}
          }
          if(-not ((Get-Content 'moolva_src/.moolva_easy_version' -Raw).Trim() -eq '2.4.0')){throw 'Version file mismatch'}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply MoOLVa Enterprise 3.0 features
        shell: pwsh
        run: |
          python moolva300/apply300.py moolva_src
          if($LASTEXITCODE -ne 0){throw 'Enterprise 3.0 patch failed'}
          if(-not (Test-Path 'moolva_src/enterprise30.py')){throw 'Missing Enterprise backend'}
          if(-not ((Get-Content 'moolva_src/.moolva_easy_version' -Raw).Trim() -eq '3.0.0')){throw 'Enterprise version mismatch'}
          $guard=(Get-Content 'moolva260/upgrade_guard.ps1' -Raw).Replace("2.6.0","3.0.3")
          Set-Content -Path 'moolva300/upgrade_guard30.ps1' -Value $guard -Encoding UTF8
          $guardTest=(Get-Content 'moolva260/test_upgrade_guard.ps1' -Raw).Replace('upgrade_guard.ps1','upgrade_guard30.ps1').Replace("'2.6.0'","'3.0.3'")
          Set-Content -Path 'moolva300/test_upgrade_guard30.ps1' -Value $guardTest -Encoding UTF8
          python -m py_compile moolva_src/enterprise30.py moolva_src/web19_bridge.py

      - name: Apply one-screen quick journals 3.0.1
        shell: pwsh
        run: |
          python moolva301/apply301.py moolva_src
          if($LASTEXITCODE -ne 0){throw 'Quick journal overlay failed'}
          python -m py_compile moolva_src/quick31.py moolva_src/web19_bridge.py
          if($LASTEXITCODE -ne 0){throw 'Quick journal Python syntax failed'}
          if(-not ((Get-Content 'moolva_src/.moolva_easy_version' -Raw).Trim() -eq '3.0.1')){throw '3.0.1 version mismatch'}
          if(-not ((Get-Content 'moolva_src/web19/index.html' -Raw).Contains('quick31-layout'))){throw 'Quick journal interface missing'}

      - name: Enable shared employee chooser across all forms
        shell: pwsh
        run: |
          python moolva302/apply302.py moolva_src
          if($LASTEXITCODE -ne 0){throw '3.0.2 employee selection overlay failed'}
          if(-not ((Get-Content 'moolva_src/.moolva_easy_version' -Raw).Trim() -eq '3.0.2')){throw '3.0.2 version mismatch'}
          python -m py_compile moolva_src/web19_bridge.py
          if($LASTEXITCODE -ne 0){throw '3.0.2 Python syntax failed'}

      - name: Check staff picker safety and simplified journal controls
        shell: pwsh
        run: |
          node moolva302/test_staff_picker302.js
          if($LASTEXITCODE -ne 0){throw 'Staff picker unit tests failed'}
          @'
          import pathlib,re,subprocess,tempfile
          page=pathlib.Path('moolva_src/web19/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',page)
          picker=[x for x in scripts if 'MoOLVaStaffPicker302' in x]
          if len(picker)!=1:raise SystemExit('Missing or duplicate global staff picker')
          with tempfile.TemporaryDirectory() as folder:
              file=pathlib.Path(folder)/'staff302.js'
              file.write_text(picker[0],encoding='utf-8')
              result=subprocess.run(['node','--check',str(file)],capture_output=True,text=True)
              print(result.stderr)
              if result.returncode:raise SystemExit('Broken employee chooser JavaScript')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Embedded employee selector check failed'}

      - name: Test one-screen journals with actual SQLite
        shell: pwsh
        working-directory: moolva_src
        run: |
          python -m unittest discover -s ../moolva301 -p 'test_quick31.py' -v
          if($LASTEXITCODE -ne 0){throw 'One-screen journals regression failed'}
          @'
          import pathlib,re,subprocess,tempfile
          source=pathlib.Path('web19/index.html').read_text(encoding='utf-8')
          if 'quick31SaveReading' not in source:raise SystemExit('Quick Save handler missing')
          with tempfile.TemporaryDirectory() as folder:
              script=pathlib.Path(folder)/'journal-ui.js'
              scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',source)
              for chunk in scripts:
                  if 'quick31SaveReading' in chunk:
                      script.write_text(chunk,encoding='utf-8')
                      break
              else:raise SystemExit('Quick journal inline script missing')
              p=subprocess.run(['node','--check',str(script)],capture_output=True,text=True)
              print(p.stdout,p.stderr)
              if p.returncode:raise SystemExit('Quick journal JavaScript syntax error')
          '@ | python -

      - name: Integrate bulk PDF export for current month
        shell: pwsh
        run: |
          python moolva303/apply303.py moolva_src
          if($LASTEXITCODE -ne 0){throw 'PDF journal export overlay failed'}
          python -m py_compile moolva_src/bulk303.py moolva_src/web19_bridge.py
          if($LASTEXITCODE -ne 0){throw 'PDF export Python syntax failed'}
          if(-not ((Get-Content 'moolva_src/.moolva_easy_version' -Raw).Trim() -eq '3.0.3')){throw 'Version mismatch'}
          if(-not ((Get-Content 'moolva_src/web19/index.html' -Raw).Contains('MoOLVaBulk303'))){throw 'Missing export UI controls'}

      - name: Verify six real journal PDFs and archive contents
        shell: pwsh
        working-directory: moolva_src
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pypdf
          if($LASTEXITCODE -ne 0){throw 'Cannot install PDF dependencies'}
          python -m unittest discover -s ../moolva303 -p 'test_bulk303.py' -v
          if($LASTEXITCODE -ne 0){throw 'Mass PDF export regression failed'}
          @'
          import pathlib,re,subprocess,tempfile
          page=pathlib.Path('web19/index.html').read_text(encoding='utf-8')
          snippets=re.findall(r'<script[^>]*>([\s\S]*?)</script>',page)
          scripts=[x for x in snippets if 'MoOLVaBulk303' in x]
          if len(scripts)!=1:raise SystemExit('Bulk PDF UI missing or repeated')
          with tempfile.TemporaryDirectory() as folder:
              file=pathlib.Path(folder)/'mass-export303.js'
              file.write_text(scripts[0],encoding='utf-8')
              p=subprocess.run(['node','--check',str(file)],capture_output=True,text=True)
              print(p.stderr)
              if p.returncode:raise SystemExit('Broken bulk export JavaScript')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Bulk PDF UI syntax failed'}

      - name: Test MoOLVa 3.0 Enterprise operations
        shell: pwsh
        working-directory: moolva_src
        run: |
          python -m unittest discover -s ../moolva300 -p 'test_enterprise30.py' -v
          if($LASTEXITCODE -ne 0){throw '3.0 Enterprise regression failed'}

      - name: Verify Windows updater process isolation and rollback
        shell: pwsh
        run: |
          & ./moolva300/test_upgrade_guard30.ps1
          if($LASTEXITCODE -ne 0){throw 'MoOLVa Windows upgrade guard regression failed'}

      - name: Verify guided company creation and isolated drafts
        shell: pwsh
        working-directory: moolva_src
        run: |
          python -m unittest discover -s tests -p 'test_onboarding222.py' -v
          if($LASTEXITCODE -ne 0){throw 'Guided onboarding tests failed'}
          python -m unittest discover -s tests -p 'test_intelligent24.py' -v
          if($LASTEXITCODE -ne 0){throw 'Smart HACCP 2.4 tests failed'}
          python -m unittest discover -s tests -p 'test_enterprise23.py' -v
          if($LASTEXITCODE -ne 0){throw 'Enterprise 2.3 tests failed'}

      - name: Verify server and updated migration
        shell: pwsh
        working-directory: moolva_src
        run: |
          python web19_bridge.py --self-test
          if($LASTEXITCODE -ne 0){throw 'Server self-test failed'}
          python web19_bridge.py --startup-test
          if($LASTEXITCODE -ne 0){throw 'Startup or migration failed'}

      - name: Package independent Python server and native WPF Desktop
        shell: pwsh
        working-directory: moolva_src
        run: |
          & ./scripts/build_native_windows221.ps1 -SkipTests
          if($LASTEXITCODE -ne 0){throw 'Native package build failed'}
          $dir='dist/native221/MoOLVa_HACCP_Easy_2.4.0_Native_Portable'
          if(-not (Test-Path "$dir/MoOLVaDesktop.exe")){throw 'Native desktop not found'}
          if(-not (Test-Path "$dir/MoOLVaServer/MoOLVaServer.exe")){throw 'Python backend not found'}

      - name: Mark portable build as MoOLVa 3.0.3
        shell: pwsh
        working-directory: moolva_src
        run: |
          $from='dist/MoOLVa_HACCP_Easy_2.4.0_Native_Portable.zip'
          $to='dist/MoOLVa_HACCP_Easy_3.0.3_Enterprise_Portable.zip'
          if(-not (Test-Path $from)){throw 'Missing generated portable archive'}
          Copy-Item -LiteralPath $from -Destination $to -Force

      - name: Create signed-file hash manifest for installer verification
        shell: pwsh
        working-directory: moolva_src
        run: |
          $portable='dist/native221/MoOLVa_HACCP_Easy_2.4.0_Native_Portable'
          $files=@{}
          foreach($rel in @('MoOLVaDesktop.exe','MoOLVaServer\MoOLVaServer.exe')){
            $full=Join-Path $portable $rel
            if(-not (Test-Path $full)){throw "Cannot hash missing release file: $rel"}
            $files[$rel]=(Get-FileHash -Path $full -Algorithm SHA256).Hash
          }
          $manifest=@{version='3.0.3';files=$files}
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $portable 'moolva_release_manifest.json') -Encoding utf8

      - name: Smoke test packed Python without installed Python
        shell: pwsh
        working-directory: moolva_src
        run: |
          & 'dist/native221/MoOLVa_HACCP_Easy_2.4.0_Native_Portable/MoOLVaServer/MoOLVaServer.exe' --startup-test
          if($LASTEXITCODE -ne 0){throw 'Packed server startup test failed'}

      - name: Test Native Desktop window and process shutdown
        shell: pwsh
        working-directory: moolva_src
        run: |
          python scripts/native_windows_e2e221.py
          if($LASTEXITCODE -ne 0){throw 'Native UI test failed — see desktop launch diagnostic'}

      - name: Compile Russian native Windows installer
        shell: pwsh
        working-directory: moolva_src
        run: |
          if(-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')){
            choco install innosetup --no-progress -y
            if($LASTEXITCODE -ne 0){throw 'Could not install Inno Setup compiler'}
          }
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not (Test-Path $iscc)){throw 'Missing Inno Setup compiler'}
          @'
          [Setup]
          AppId=MoOLVaHACCPNative221
          UsePreviousAppDir=yes
          AppName=MoOLVa ХАССП Easy
          AppVersion=3.0.3
          AppPublisher=MoOLVa
          DefaultDirName={localappdata}\Programs\MoOLVaHACCPEasyNative
          DefaultGroupName=MoOLVa ХАССП Easy
          OutputDir=dist
          OutputBaseFilename=MoOLVa_HACCP_Easy_3.0.3_ENTERPRISE_CANDIDATE_Setup
          SetupIconFile=assets\MoOLVa_HACCP.ico
          UninstallDisplayIcon={app}\MoOLVaDesktop.exe
          LicenseFile=LICENSE_RU.txt
          PrivilegesRequired=lowest
          WizardStyle=modern
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          CloseApplications=force
          RestartApplications=no
          DisableProgramGroupPage=yes
          [Code]
          var
            MoOLVaInstalledBefore: Boolean;
            MoOLVaSnapshotDir: String;
            MoOLVaPrepared: Boolean;
            MoOLVaValidated: Boolean;

          function RunMoOLVaGuard(Mode: String): Boolean;
          var
            ExitCode: Integer;
            ScriptName: String;
            CommandLine: String;
          begin
            ScriptName := ExpandConstant('{tmp}\upgrade_guard.ps1');
            CommandLine := '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' +
              ScriptName + '" -Mode ' + Mode + ' -InstallDir "' + ExpandConstant('{app}') +
              '" -DataDir "' + ExpandConstant('{localappdata}\MoOLVaHACCPStudio') +
              '" -SnapshotDir "' + MoOLVaSnapshotDir + '"';
            Result := Exec(ExpandConstant('{sys}\WindowsPowerShell\v1.0\powershell.exe'),
              CommandLine, '', SW_HIDE, ewWaitUntilTerminated, ExitCode);
            if Result then
              Result := (ExitCode = 0);
          end;

          function InitializeSetup(): Boolean;
          begin
            MoOLVaInstalledBefore := FileExists(ExpandConstant('{localappdata}\Programs\MoOLVaHACCPEasyNative\MoOLVaDesktop.exe'));
            MoOLVaPrepared := False;
            MoOLVaValidated := False;
            Result := True;
          end;

          procedure CurPageChanged(CurPageID: Integer);
          begin
            if CurPageID = wpWelcome then
            begin
              if MoOLVaInstalledBefore then
                WizardForm.WelcomeLabel2.Caption :=
                  'Установщик обновит MoOLVa до предварительной версии 2.6. Перед заменой файлов ' +
                  'программа закроет свои процессы и создаст резервную копию программы и данных.';
            end;
            if CurPageID = wpReady then
            begin
              if MoOLVaInstalledBefore then
                WizardForm.NextButton.Caption := 'Обновить'
              else
                WizardForm.NextButton.Caption := 'Установить';
            end;
          end;

          function PrepareToInstall(var NeedsRestart: Boolean): String;
          begin
            Result := '';
            ExtractTemporaryFile('upgrade_guard.ps1');
            MoOLVaSnapshotDir := ExpandConstant('{localappdata}\MoOLVaHACCPUpdateBackups\') +
              GetDateTimeString('yyyymmdd_hhnnss_zzz', '-', ':');
            if not RunMoOLVaGuard('Prepare') then
              Result := 'MoOLVa не удалось безопасно остановить или сохранить резервную копию. ' +
                'Установка прервана до изменения файлов. Проверьте свободное место на диске и права доступа.'
            else
              MoOLVaPrepared := True;
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          begin
            if (CurStep = ssPostInstall) and MoOLVaPrepared then
            begin
              if not RunMoOLVaGuard('Validate') then
                RaiseException('Проверка файлов новой версии не пройдена. ' +
                  'Установщик восстановит предыдущую версию из резервной копии.');
              MoOLVaValidated := True;
            end;
          end;

          procedure DeinitializeSetup();
          begin
            if MoOLVaPrepared and (not MoOLVaValidated) then
            begin
              if not RunMoOLVaGuard('Rollback') then
                MsgBox('Не удалось автоматически восстановить предыдущую версию. ' +
                  'Резервная копия сохранена в папке: ' + MoOLVaSnapshotDir, mbCriticalError, MB_OK);
            end;
          end;

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"
          [Files]
          Source: "..\moolva300\upgrade_guard30.ps1"; DestName: "upgrade_guard.ps1"; Flags: dontcopy
          Source: "dist\native221\MoOLVa_HACCP_Easy_2.4.0_Native_Portable\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\MoOLVa ХАССП Easy"; Filename: "{app}\MoOLVaDesktop.exe"
          Name: "{autodesktop}\MoOLVa ХАССП Easy"; Filename: "{app}\MoOLVaDesktop.exe"
          [Run]
          Filename: "{app}\MoOLVaDesktop.exe"; Description: "Запустить MoOLVa ХАССП Easy"; Flags: postinstall unchecked skipifsilent nowait
          '@ | Set-Content -Encoding utf8 'MoOLVa230Installer.iss'
          & $iscc 'MoOLVa230Installer.iss'
          if($LASTEXITCODE -ne 0){throw 'Inno Setup compilation failed'}
          if(-not (Test-Path 'dist/MoOLVa_HACCP_Easy_3.0.3_ENTERPRISE_CANDIDATE_Setup.exe')){throw 'No installer output'}

      - name: Validate installing setup on Windows
        shell: pwsh
        working-directory: moolva_src
        run: |
          $installer=(Resolve-Path 'dist/MoOLVa_HACCP_Easy_3.0.3_ENTERPRISE_CANDIDATE_Setup.exe').Path
          $dir=Join-Path $env:LOCALAPPDATA 'MoOLVa26TestInstall'
          $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$dir+'"'))
          $p=Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Setup exit $($p.ExitCode)"}
          foreach($f in @('MoOLVaDesktop.exe','MoOLVaServer\MoOLVaServer.exe')){
            if(-not (Test-Path (Join-Path $dir $f))){throw "Installed package missing $f"}
          }
          $manifest=Join-Path $dir 'moolva_release_manifest.json'
          if(-not (Test-Path $manifest)){throw 'Installer failed to ship release hashes'}
          $data=Join-Path $env:LOCALAPPDATA 'MoOLVaHACCPStudio'
          New-Item -ItemType Directory -Force $data | Out-Null
          $marker=Join-Path $data 'moolva_26_existing_data_marker.txt'
          'DO_NOT_LOSE_EXISTING_DATA' | Set-Content -Path $marker
          $p=Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Upgrade setup exit $($p.ExitCode)"}
          if((Get-Content $marker -Raw).Trim() -ne 'DO_NOT_LOSE_EXISTING_DATA'){throw 'Existing data lost during upgrade'}
          $snapshots=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'MoOLVaHACCPUpdateBackups') -Directory -ErrorAction Stop
          if($snapshots.Count -lt 2){throw 'Expected backups from both installations'}
          Write-Output 'WINDOWS_260_INSTALL_AND_REINSTALL_DATA_OK'

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MoOLVa-HACCP-Easy-3.0.3-BULK-PDF-Windows
          path: |
            moolva_src/dist/MoOLVa_HACCP_Easy_3.0.3_ENTERPRISE_CANDIDATE_Setup.exe
            moolva_src/dist/MoOLVa_HACCP_Easy_3.0.3_Enterprise_Portable.zip
          retention-days: 14
