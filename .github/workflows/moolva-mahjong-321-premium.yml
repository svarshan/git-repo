name: MoOLVa Mahjong 3.2.1 Premium 3D — Android Studio and Real Screenshots
on:
  push:
    branches: [moolva-mahjong-3.2.1-premium-3d]
    paths: ['mahjong321/**','.github/workflows/moolva-mahjong-321-premium.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore trusted 3.1.3 project source
        run: |
          set -euo pipefail
          mkdir -p mahjong320/project
          cat mahjong310/source.part* | base64 -d >/tmp/moolva310.tar.gz
          echo 'a1411bda692d6b177943725c8bc96a84f140961a29e15862964b532a185aa481  /tmp/moolva310.tar.gz' | sha256sum -c -
          tar -xzf /tmp/moolva310.tar.gz -C mahjong320/project
          python3 mahjong311/patch.py mahjong320/project
          python3 mahjong312/patch.py mahjong320/project
          python3 mahjong313/patch.py mahjong320/project
      - name: Prepare premium artwork generation
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-arphic-gkai00mp fonts-font-awesome
          python3 -m pip install --user --quiet pillow numpy
      - name: Build premium tile materials and GL geometry
        run: |
          python3 mahjong320/generate_textures.py mahjong320/project
          python3 mahjong320/apply_patch.py mahjong320/project
          python3 mahjong321/patch.py mahjong320/project
          test -f mahjong320/project/app/src/main/assets/premium/finish_0/00.jpg
          test -f mahjong320/project/app/src/main/assets/premium/finish_6/23.jpg
          test -f mahjong320/project/gradle/wrapper/gradle-wrapper.jar
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gameplay logic, 1500 levels and shuffle tests
        working-directory: mahjong320/project
        run: bash tests/run-tests.sh
      - name: Compile and lint Android 3D project
        working-directory: mahjong320/project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Verify versioned real Android package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging mahjong320/project/app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='3.2.1'"
      - name: Package independent Android Studio folder (no APK)
        run: |
          set -euo pipefail
          mkdir -p mahjong320/dist/MoOLVaMahjong_Ultimate_3_2_1_Premium3D
          rsync -a --exclude=local.properties --exclude=.gradle --exclude=out --exclude=build --exclude=tests/out \
            mahjong320/project/ mahjong320/dist/MoOLVaMahjong_Ultimate_3_2_1_Premium3D/
          cd mahjong320/dist
          zip -qr ../MoOLVa_Mahjong_3.2.1_Premium3D_AndroidStudio.zip MoOLVaMahjong_Ultimate_3_2_1_Premium3D
          unzip -l ../MoOLVa_Mahjong_3.2.1_Premium3D_AndroidStudio.zip | grep -F gradle-wrapper.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Mahjong-3.2.1-Premium3D-AndroidStudio
          path: mahjong320/MoOLVa_Mahjong_3.2.1_Premium3D_AndroidStudio.zip
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: moolva321-emulator-only-apk
          path: mahjong320/project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2
          if-no-files-found: error
  actual-screens:
    needs: build-studio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: moolva321-emulator-only-apk
          path: ./apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture actual UI from running Android application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          script: |
            set -e
            mkdir -p gallery
            adb install apk/app-debug.apk
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am start -n com.moolva.mahjong/.MainActivity
            sleep 5
            adb shell input tap 275 1045
            sleep 1
            adb exec-out screencap -p > gallery/01_home.png
            adb shell input tap 540 1644
            sleep 2
            adb exec-out screencap -p > gallery/02_collections.png
            adb shell am force-stop com.moolva.mahjong
            adb shell am start -n com.moolva.mahjong/.MainActivity --ez visual_preview true
            sleep 5
            adb shell input tap 275 1045
            sleep 2
            adb exec-out screencap -p > gallery/03_3d_game.png
            adb shell input tap 155 1910
            sleep 2
            adb exec-out screencap -p > gallery/04_game_hint.png
            adb logcat -d -s AndroidRuntime:E > gallery/android_crash_log.txt
            if grep -q 'FATAL EXCEPTION' gallery/android_crash_log.txt; then cat gallery/android_crash_log.txt; exit 1; fi
            file gallery/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-3.2.1-Actual-Android-Screenshots
          path: gallery/
          retention-days: 30
          if-no-files-found: error
