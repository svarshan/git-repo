name: MoOLVa Windows Master 3.0 Native
on:
  push:
    branches: [windows-master-native-3-0]
    paths:
      - 'windows-master-native/**'
      - '.github/workflows/windows-master-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native C sharp application
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /target:winexe /platform:anycpu /codepage:65001 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Management.dll /reference:Microsoft.CSharp.dll /out:dist/MoOLVa-Windows-Master-3.0-Portable.exe '.\windows-master-native\Program.cs'
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
      - name: Run safety self tests
        shell: powershell
        run: |
          $p = Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-3.0-Portable.exe).Path -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed: $($p.ExitCode)" }
      - name: Test actual window and capture screenshot
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'MoOLVa-3.0-Window.png'
          $arg='--screenshot="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-3.0-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force;throw 'Window test timed out'}
          if($p.ExitCode -ne 0 -or -not (Test-Path $shot)){throw 'Screenshot or launch failed'}
          if((Get-Item $shot).Length -lt 3000){throw 'Screenshot unexpectedly small'}
      - name: Package instructions
        shell: powershell
        run: Copy-Item windows-master-native/README.txt dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Windows-Master-3.0-Native
          path: dist/
          if-no-files-found: error
          retention-days: 30
