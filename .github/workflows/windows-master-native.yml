name: MoOLVa Windows Master 4.0-preview Native
on:
  push:
    branches: [windows-master-native-4-0-preview, windows-master-4-0-verify-usb, windows-master-4-1-reliable]
    paths:
      - 'windows-master-native/**'
      - '.github/workflows/windows-master-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned WebView2 SDK
        shell: powershell
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'WebView2 SDK download failed'}
      - name: Compile self contained EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $pkg=(Resolve-Path packages/Microsoft.Web.WebView2.1.0.2903.40).Path
          $lib=Join-Path $pkg 'lib/net462'
          if(-not (Test-Path (Join-Path $lib 'Microsoft.Web.WebView2.WinForms.dll'))){$lib=Join-Path $pkg 'lib/net45'}
          $core=Join-Path $lib 'Microsoft.Web.WebView2.Core.dll'
          $winforms=Join-Path $lib 'Microsoft.Web.WebView2.WinForms.dll'
          $x64=Get-ChildItem $pkg -Recurse -File -Filter WebView2Loader.dll | Where-Object {$_.FullName -match '(win-x64|native[\\/]x64)[\\/]'} | Select-Object -First 1
          $x86=Get-ChildItem $pkg -Recurse -File -Filter WebView2Loader.dll | Where-Object {$_.FullName -match '(win-x86|native[\\/]x86)[\\/]'} | Select-Object -First 1
          if(-not (Test-Path $core) -or -not (Test-Path $winforms) -or -not $x64 -or -not $x86){throw 'WebView2 SDK files missing'}
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $args=@('/nologo','/target:winexe','/platform:anycpu','/codepage:65001','/reference:System.Windows.Forms.dll','/reference:System.Drawing.dll','/reference:System.Management.dll','/reference:System.Web.Extensions.dll','/reference:Microsoft.CSharp.dll',("/reference:$core"),("/reference:$winforms"),'/out:dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe',("/resource:$core,Microsoft.Web.WebView2.Core.dll"),("/resource:$winforms,Microsoft.Web.WebView2.WinForms.dll"),("/resource:$($x64.FullName),WebView2Loader-x64.dll"),("/resource:$($x86.FullName),WebView2Loader-x86.dll"),'.\windows-master-native\Program.cs','.\windows-master-native\Bootstrap.cs','.\windows-master-native\IsoBrowser.cs','.\windows-master-native\NativeIsoWizard.cs','.\windows-master-native\IsoMount.cs','.\windows-master-native\UsbWriter.cs','.\windows-master-native\ServiceCards.cs')
          & $csc @args
          if($LASTEXITCODE -ne 0){throw 'Compilation failed'}
      - name: Run safety self tests
        shell: powershell
        run: |
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Self-test failed: $($p.ExitCode)"}
      - name: Probe Windows Update without installation
        shell: powershell
        run: |
          $log=Join-Path (Resolve-Path dist).Path 'Windows-Update-Probe.txt'
          $arg='--wua-probe="'+$log+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(90000)){Stop-Process -Id $p.Id -Force;Set-Content -Path $log -Value 'TIMEOUT: Windows Update search did not finish'}
          if(Test-Path $log){Get-Content $log}else{Set-Content -Path $log -Value 'UNAVAILABLE: probe exited without output'}
      - name: Test native ISO mounting
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pycdlib==1.14.0
          if($LASTEXITCODE -ne 0){throw 'Cannot install ISO fixture generator'}
          python windows-master-native/tests/make_fixture.py
          if($LASTEXITCODE -ne 0){throw 'ISO fixture generation failed'}
          $iso=(Resolve-Path fixture.iso).Path
          $arg='--mount-test="'+$iso+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force; Set-Content ($iso+'.result.txt') 'TIMEOUT: ISO mount'}
          if(Test-Path ($iso+'.result.txt')){Copy-Item ($iso+'.result.txt') dist/ISO-Mount-Test.txt}else{Set-Content dist/ISO-Mount-Test.txt 'UNAVAILABLE: no result'}
          Get-Content dist/ISO-Mount-Test.txt
          if(-not (Select-String -Path dist/ISO-Mount-Test.txt -SimpleMatch 'SUCCESS:' -Quiet)){throw 'ISO mount test did not succeed'}
      - name: Test formatter on isolated virtual disk
        shell: powershell
        run: |
          ./windows-master-native/tests/VhdFormatTest.ps1
          if(-not (Select-String -Path dist/VHD-Format-Test.txt -SimpleMatch 'SUCCESS:' -Quiet)){throw 'Virtual disk test did not succeed'}
      - name: Inspect Microsoft page in built-in window
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'Microsoft-ISO-Page-Test.png'
          $arg='--browser-live="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force;Set-Content ($shot+'.status.txt') 'TIMEOUT: Microsoft page'}
          if(Test-Path ($shot+'.status.txt')){Get-Content ($shot+'.status.txt')}else{Set-Content ($shot+'.status.txt') 'UNAVAILABLE: no result'}
      - name: Inspect Windows 10 page
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'Microsoft-Windows10-Page-Test.png'
          $arg='--browser-live10="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force;Set-Content ($shot+'.status.txt') 'TIMEOUT: Microsoft page'}
          if(Test-Path ($shot+'.status.txt')){Get-Content ($shot+'.status.txt')}else{Set-Content ($shot+'.status.txt') 'UNAVAILABLE: no result'}
      - name: Probe ISO download handoff without full download
        shell: powershell
        run: |
          foreach($version in @('10','11')) {
            $log=Join-Path (Resolve-Path dist).Path ('ISO-Download-Probe-'+$version+'.txt')
            $arg='--download-probe'+$version+'="'+$log+'"'
            $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
            if(-not $p.WaitForExit(130000)){Stop-Process -Id $p.Id -Force;Set-Content $log 'TIMEOUT: ISO handoff probe'}
            if(Test-Path $log){Get-Content $log}else{Set-Content $log 'UNAVAILABLE: probe exited without output'}
          }
      - name: Test native ISO download wizard
        shell: powershell
        run: |
          foreach($version in @('10','11')) {
            $log=Join-Path (Resolve-Path dist).Path ('Native-ISO-Wizard-Probe-'+$version+'.txt')
            $arg='--wizard-probe'+$version+'="'+$log+'"'
            $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
            if(-not $p.WaitForExit(150000)){Stop-Process -Id $p.Id -Force;Set-Content $log 'TIMEOUT: native ISO wizard'}
            if(Test-Path $log){Get-Content $log}else{Set-Content $log 'UNAVAILABLE: no result'}
          }
      - name: Capture native ISO wizard
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'MoOLVa-4.0-preview-ISO-wizard.png'
          $arg='--wizard-screenshot="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(60000)){Stop-Process -Id $p.Id -Force;throw 'Native wizard screenshot timed out'}
          if($p.ExitCode -ne 0 -or -not (Test-Path $shot)){throw 'Native wizard screenshot failed'}
      - name: Test embedded WebView2 window
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'MoOLVa-4.0-preview-ISO-window.png'
          $arg='--browser-smoke="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force;throw 'WebView2 test timed out'}
          if($p.ExitCode -ne 0 -or -not (Test-Path $shot)){if(Test-Path ($shot+'.error.txt')){Get-Content ($shot+'.error.txt')};throw 'WebView2 window failed'}
      - name: Capture application window
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'MoOLVa-4.0-preview-Window.png'
          $arg='--screenshot="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force;throw 'Window test timed out'}
          if($p.ExitCode -ne 0 -or -not (Test-Path $shot)){throw 'Screenshot failed'}
      - name: Capture service cards window
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'MoOLVa-4.1-Cards.png'
          $arg='--cards-screenshot="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList $arg -PassThru
          if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force;throw 'Cards screenshot timed out'}
          if($p.ExitCode -ne 0 -or -not (Test-Path $shot)){throw 'Cards screenshot failed'}
      - name: Capture Windows selection page
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'MoOLVa-4.0-preview-Windows.png'
          $arg='--screenshot="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList @('--windows',$arg) -PassThru
          if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force;throw 'Windows page test timed out'}
          if($p.ExitCode -ne 0 -or -not (Test-Path $shot)){throw 'Windows screenshot failed'}
      - name: Capture driver window
        shell: powershell
        run: |
          $shot=Join-Path (Resolve-Path dist).Path 'MoOLVa-4.0-preview-Drivers.png'
          $arg='--screenshot="'+$shot+'"'
          $p=Start-Process (Resolve-Path dist/MoOLVa-Windows-Master-4.0-preview-Portable.exe).Path -ArgumentList @('--drivers',$arg) -PassThru
          if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force;throw 'Driver screenshot timed out'}
          if($p.ExitCode -ne 0 -or -not (Test-Path $shot)){throw 'Driver screenshot failed'}
      - name: Package instructions and license
        shell: powershell
        run: |
          Copy-Item windows-master-native/README.txt dist/README.txt
          $license=Get-ChildItem packages/Microsoft.Web.WebView2.1.0.2903.40 -Filter LICENSE* -File | Select-Object -First 1
          if($license){Copy-Item $license.FullName dist/WebView2-LICENSE.txt}
      - uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Windows-Master-4.0-preview-Portable
          path: dist/
          if-no-files-found: error
          retention-days: 30
