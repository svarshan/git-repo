name: MoOLVa — Wikimedia Commons sound search for 21 missing species
on:
  workflow_dispatch:
  push:
    branches: [feature/ptitsy-8.6-pro-max]
    paths:
      - 'PtitsyNN/scripts/commons_voices89.py'
      - '.github/workflows/ptitsy-commons-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: PtitsyNN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Check search script syntax
        run: python -m py_compile scripts/commons_voices89.py scripts/attach_voices88.py
      - name: Discover downloadable licensed audio with no modification to catalog
        run: python -u scripts/commons_voices89.py
      - name: Upload real recordings and discovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Remaining21-Commons-Discovery
          path: |
            PtitsyNN/dist/commons-audio89/*.mp3
            PtitsyNN/dist/release-evidence/commons-discovery89.json
          if-no-files-found: warn
          retention-days: 30
