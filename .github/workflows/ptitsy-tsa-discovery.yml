name: MoOLVa — Tierstimmenarchiv licensed bird sounds for 21 species
on:
  workflow_dispatch:
  push:
    branches: [feature/ptitsy-8.6-pro-max]
    paths:
      - 'PtitsyNN/scripts/tsa_voices89.py'
      - '.github/workflows/ptitsy-tsa-discovery.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: PtitsyNN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg dependency
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Check archival audio research script
        run: python -m py_compile scripts/tsa_voices89.py
      - name: Search all 21 remaining species; download CC BY and CC BY-SA candidates
        run: python -u scripts/tsa_voices89.py
      - name: Archive QA report and real playable MP3 sound samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoOLVa-Tierstimmenarchiv-21-Candidates
          path: |
            PtitsyNN/dist/tier-audio89/*.mp3
            PtitsyNN/dist/release-evidence/tsa-discovery89.json
          if-no-files-found: warn
          retention-days: 30
