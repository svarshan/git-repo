function validClip(url){return typeof url==='string'&&((url.length<2500000&&/^data:audio\/(?:mpeg|mp3|ogg|wav|webm|mp4);base64,[a-zA-Z0-9+/=]+$/.test(url))||(/^\.\/audio\/(?:finik|helper)\/[a-f0-9]{24,64}\.mp3$/.test(url)));}
function normalizePack(pack){if(!pack||typeof pack!=='object')throw Error('Пакет не распознан.');let voices;
 if(pack.version===1&&pack.clips)voices={finik:pack.clips,helper:{}};
 else if(pack.version===2&&pack.voices)voices=pack.voices;
 else throw Error('Ожидается голосовой пакет v1 или v2.');
 const cleaned={version:2,voices:{finik:{},helper:{}}};let total=0;
 for(const role of ['finik','helper'])for(const [raw,url] of Object.entries(voices[role]||{})){
   if(raw.length<1||raw.length>500||!validClip(url))continue;
   cleaned.voices[role][voiceKey(raw)]=url;total++;if(total>5000)throw Error('Слишком много аудиозаписей.');
 }
 if(!total)throw Error('Аудиофайлы отсутствуют.');return cleaned;
}
function installClips(pack){const clean=normalizePack(pack);for(const role of ['finik','helper']){
 for(const [key,url] of Object.entries(clean.voices[role]))voiceClips[role].set(key,url);
 }voicePackCount=voiceClipCount();return clean;}
function audioDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('IndexedDB недоступна'));
 const req=indexedDB.open(AUDIO_DB,AUDIO_DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('packs'))db.createObjectStore('packs');if(!db.objectStoreNames.contains('overrides'))db.createObjectStore('overrides');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function audioDBPut(store,key,value){const db=await audioDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}finally{db.close();}}
async function audioDBRead(store,key){const db=await audioDb();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}finally{db.close();}}
async function audioDBClear(store,key){const db=await audioDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}finally{db.close();}}
async function restoreAudioPack(){try{const data=await audioDBRead('packs','active');if(data){const installed=installClips(data);importedVoicePack=Object.keys(installed.voices.finik).length+Object.keys(installed.voices.helper).length;}const fixes=await audioDBRead('overrides','local');if(fixes&&typeof fixes==='object'){for(const [k,v] of Object.entries(fixes))if(validClip(v))clipOverrides[k]=v;}voicePackCount=voiceClipCount();updateStudioNote();}catch(e){console.warn('Не удалось восстановить аудиофайлы',e?.message||e);}}
function updateStudioNote(){const node=document.getElementById('studio-note');if(!node)return;const fx=voiceClips.finik.size,hl=voiceClips.helper.size,n=Object.keys(clipOverrides).length;
 node.textContent=`Финик: ${fx} реплик · Помощник: ${hl} реплик · Заменено вручную: ${n}. ${fx||hl||n?'MP3 работают офлайн. Нет MP3 — нет натурального голоса.':'Голосовой пакет отсутствует. Системный голос по умолчанию отключён.'}`;}
async function importVoicePack(file){if(!file)return;if(file.size>180*1024*1024)return toast('Пакет больше 180 МБ.');try{
 const pack=normalizePack(JSON.parse(await file.text()));installClips(pack);importedVoicePack=Object.keys(pack.voices.finik).length+Object.keys(pack.voices.helper).length;
 try{await audioDBPut('packs','active',pack);toast('Голосовой пакет сохранён для автономной работы.');}
 catch{toast('Звук загружен, но браузер не смог сохранить его на будущее.');}
 updateStudioNote();if(currentPage==='parents')render();updateVoiceHealth();
 }catch(e){toast('Ошибка загрузки: '+e.message);}}

function installEmbedded(){if(!EMBEDDED_VOICE_PACK||!Object.keys(EMBEDDED_VOICE_PACK).length)return;
 try{installClips(EMBEDDED_VOICE_PACK.version?EMBEDDED_VOICE_PACK:{version:1,clips:EMBEDDED_VOICE_PACK});}catch(e){console.warn('Встроенный голосовой пакет повреждён',e);}}

function clipFor(text,role='finik'){const key=voiceKey(text),ov=clipOverrides[`${role}|${key}`];if(validClip(ov))return ov;
 return voiceClips[role]?.get(key)||null;}
function saveQA(){try{localStorage.setItem(QA_STORE,JSON.stringify(voiceQA));}catch{toast('Браузер не сохранил проверку записи.');}}
function updateVoiceReview(text,role,approved){voiceQA[`${role}|${voiceKey(text)}`]=approved?'listened':'problem';saveQA();if(currentPage==='parents')render();}
function syllabified(word){const clean=voiceKey(word);return PRACTICE_SYLLABLES[clean]||stressed(word);}
function syllableSpeech(word){return syllabified(word).replace(/·/g,'. ').replace(/[\u0300-\u036f]/g,'')+'.';}

async function importIndividualClip(file){if(!file||!studioReplaceText)return; if(file.size>1600000)return toast('MP3 слишком большой (максимум 1,6 МБ).');
 const arr=await file.arrayBuffer();const bytes=new Uint8Array(arr);if(bytes.length<4||!(String.fromCharCode(...bytes.slice(0,3))==='ID3'||(bytes[0]===255&&(bytes[1]&224)===224)))return toast('Выберите настоящий MP3-файл.');
 let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
 const data='data:audio/mpeg;base64,'+btoa(binary),key=`${studioRole}|${voiceKey(studioReplaceText)}`;
 clipOverrides[key]=data;voicePackCount=voiceClipCount();try{await audioDBPut('overrides','local',clipOverrides);toast('Новая запись сохранена для этого диктора.');}
 catch{toast('Запись загружена, но не сохранена. Для сохранения нужен обычный браузер.');}
 if(currentPage==='parents')render();}
function exportQA(){const lines=[['Диктор','Реплика','Прослушивание','Наличие записи']];for(const x of VOICE_MANIFEST)for(const role of ['finik','helper'])lines.push([role,x.text,voiceQA[`${role}|${voiceKey(x.text)}`]||'не проверено',clipFor(x.text,role)?'есть':'нет']);
 const content='\ufeff'+lines.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='MoOLVa_2.2_voice_review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}

function pauseRecording(){try{if(recorder?.state==='recording')recorder.stop();}catch{}if(recordStream){recordStream.getTracks().forEach(t=>t.stop());recordStream=null;}}
async function beginRecording(){if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){toast('Запись недоступна в этом браузере. Попробуйте Chrome или Edge с разрешённым микрофоном.');return;}if(recordBusy||recorder?.state==='recording')return;recordBusy=true;try{stopSpeech();pauseRecording();if(recordUrl){URL.revokeObjectURL(recordUrl);recordUrl='';}recordStream=await navigator.mediaDevices.getUserMedia({audio:true});if(currentPage!=='record'){pauseRecording();recordBusy=false;return;}const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(recordStream,mime?{mimeType:mime}:undefined);recordChunks=[];recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};recorder.onstop=()=>{if(recordChunks.length)recordUrl=URL.createObjectURL(new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'}));if(recordStream){recordStream.getTracks().forEach(t=>t.stop());recordStream=null;}recordBusy=false;if(currentPage==='record')render();};recorder.onerror=()=>{pauseRecording();recordBusy=false;toast('Не удалось записать голос. Проверьте разрешение микрофона.');};recorder.start();recordBusy=false;recordTimer=setTimeout(()=>{if(recorder?.state==='recording'){stopRecording();toast('Записали целую минуту! Послушаем.');}},60000);render();}catch{recordBusy=false;pauseRecording();toast('Микрофон недоступен. Разрешите запись в настройках браузера.');}}
function stopRecording(){clearTimeout(recordTimer);if(recorder?.state==='recording'){recorder.stop();}else pauseRecording();}
function deleteRecording(){stopRecording();if(recordUrl){URL.revokeObjectURL(recordUrl);recordUrl='';}recordChunks=[];render();}

async function cacheAllVoiceAudio24(){
 const label=document.getElementById('offline-progress24');
 if(!('caches' in window)||!window.isSecureContext){if(label)label.textContent='Для установки офлайн-аудио откройте опубликованную HTTPS-версию.';return;}
 const paths=[...new Set(['finik','helper'].flatMap(role=>[...voiceClips[role].values()].filter(url=>/^\.\/audio\//.test(url))))];
 if(!paths.length){if(label)label.textContent='Здесь нет отдельных MP3. Во встроенном HTML записи уже находятся внутри файла.';return;}
 const cache=await caches.open('moolva-voice-2.4');let ok=0,failed=0;
 for(const [i,url] of paths.entries()){
  try{if(!await cache.match(url)){const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);await cache.put(url,res);}ok++;}catch{failed++;}
  if(label&&(i%12===0||i===paths.length-1))label.textContent=`Сохранено ${ok}/${paths.length} MP3. Ошибок: ${failed}.`;
 }
 if(label)label.textContent=failed?`Сохранено ${ok}/${paths.length}. Есть пропуски — офлайн-пакет неполный.`:`Готово: ${ok} MP3 сохранены для офлайн-работы в этом браузере.`;
}

function buildDeck(type){if(type==='find')return shuffle(WORDS);if(type==='animals')return shuffle(ANIMALS);if(type==='phrase')return shuffle(state.age===3?PHRASES.slice(0,5):PHRASES);if(type==='repeat')return shuffle(REPEAT[state.age]);if(type==='clap')return shuffle(CLAPS.filter(x=>state.age===3?x[2].length<=2:state.age===4?x[2].length>=2:true));if(type==='story')return shuffle(STORIES);if(type==='actions')return shuffle(ACTIONS);if(type==='where')return shuffle(POSITIONS);if(type==='many')return shuffle(MANY);if(type==='opposite')return shuffle(OPPOSITES);if(type==='sequence')return shuffle(SEQUENCES);if(type==='dialogue')return shuffle(DIALOGS);return [];}
function startGame(type,keepGuided=false){if(!GAME_META.some(m=>m.id===type))return;stopSpeech();if(!keepGuided)guided=null;game={type,index:0,total:type==='story'?(state.age===3?3:4):['sequence','dialogue'].includes(type)?3:5,deck:buildDeck(type),answers:[],feedback:'',status:'',claps:0,showSample:false,finished:false,solved:0};currentPage='game';activityStarted=true;makeRound();render();if(location.hash!=='#games')history.pushState({page:'games'},'','#games');window.scrollTo({top:0,behavior:'instant'});speak(roundPrompt());}
function makeRound(){game.answers=[];game.feedback='';game.status='';game.claps=0;game.showSample=false;game.selected=null;const item=['story','dialogue'].includes(game.type)?game.deck[0]:game.deck[game.index%game.deck.length];game.item=item;if(game.type==='find'){const alternatives=state.age===5?[...shuffle(WORDS.filter(x=>x.type===item.type&&x.word!==item.word)),...shuffle(WORDS.filter(x=>x.type!==item.type))]:shuffle(WORDS.filter(x=>x.word!==item.word));game.options=shuffle([item,...alternatives.slice(0,state.age===3?2:3)]);}if(game.type==='animals')game.options=shuffle([item,...shuffle(ANIMALS.filter(x=>x[0]!==item[0])).slice(0,state.age===3?2:3)]);if(game.type==='phrase')game.options=shuffle([...item.words,...(state.age===5?[item.extra]:[])]);if(game.type==='actions')game.options=shuffle(item.choices);if(game.type==='where')game.options=shuffle(item.choices);if(game.type==='many'){game.options=shuffle([item[1],item[0]]);game.quantity=game.index%2+2;}if(game.type==='opposite')game.options=shuffle([item[1],...shuffle(OPPOSITES.filter(o=>o[1]!==item[1])).slice(0,2).map(x=>x[1])]);if(game.type==='sequence'){game.options=shuffle(item.parts.map((part,i)=>({...{emoji:part[0],label:part[1]},order:i})));}if(game.type==='dialogue'){game.options=[item.turns[game.index][1]];}}
function roundPrompt(){if(!game)return '';const item=game.item;switch(game.type){case 'find':return `Найди ${item.ask}.`;case 'animals':return `Кто говорит: ${item[2]}?`;case 'phrase':return `${item.question} Собери фразу из слов.`;case 'repeat':return `${item[0]}. ${item[2]} Повтори за мной.`;case 'clap':return `Произнеси слово ${item[0]}. Хлопни по слогам. Нажимай на ладошки.`;case 'story':return (game.index===0?item.intro+' ':'')+item.qs[game.index][0];case 'actions':return `Посмотри на героя. Что делает ${item.who.toLowerCase()}?`;case 'where':return item.q+' Выбери ответ.';case 'many':return `Один ${item[0]}. А как сказать, когда их много?`;case 'opposite':return `Как сказать наоборот слову ${item[0]}?`;case 'sequence':return `Расставь три картинки по порядку. ${item.title}.`;case 'dialogue':return item.turns[game.index][0];}return '';}
function gameHTML(){if(!game)return gamesHTML();if(game.finished)return resultHTML();const meta=GAME_META.find(x=>x.id===game.type);return `<button class="back-btn" data-page="games">${icon('back',17)} К играм</button>${guided?`<div class="session-note">${icon('leaf',15)} Маленькое приключение · шаг ${guided.index+1} из 3</div>`:''}<div class="game-head"><div><h1>${meta.title}</h1><p class="small muted" style="margin-top:5px">${['story','dialogue'].includes(game.type)?`Вопрос ${game.index+1} из ${game.total}`:`Задание ${game.index+1} из ${game.total}`}</p></div><div class="round-dots" aria-label="Шаг ${game.index+1} из ${game.total}">${Array.from({length:game.total},(_,i)=>`<span class="${i<game.index?'done':i===game.index?'current':''}"></span>`).join('')}</div></div><div class="surface game-stage"><div class="game-prompt"><button class="listen-btn" data-action="prompt" aria-label="Послушать задание">${icon('sound',22)}</button><p>${promptLabel()}</p></div>${['repeat','story','dialogue'].includes(game.type)?'<div class="turn-caption" id="voice-turn" aria-live="polite">Послушай вопрос. Можно ответить в своём темпе.</div>':''}${roundBody()}<div class="feedback ${game.status==='retry'?'hint':''}" role="status" aria-live="polite">${game.feedback?`${game.status==='correct'?icon('check',19):''}${esc(game.feedback)}`:''}</div><div class="game-actions">${roundActions()}</div></div><p class="adult-whisper">${adultHint()}</p>`;}
function promptLabel(){switch(game.type){case 'find':return `Где ${game.item.word.toLowerCase()}?`;case 'animals':return `Кто говорит «${game.item[2].toLowerCase()}»?`;case 'phrase':return game.item.question;case 'repeat':return 'Послушай и повтори вслух';case 'clap':return 'Сколько слогов в слове?';case 'story':return game.item.title;case 'actions':return `Что делает ${game.item.who.toLowerCase()}?`;case 'where':return game.item.q;case 'many':return 'Один — много';case 'opposite':return `Наоборот: ${game.item[0]}`;case 'sequence':return game.item.title;case 'dialogue':return game.item.title;}return '';}
function roundBody(){const item=game.item;switch(game.type){case 'find':case 'animals':return `<div class="choices">${game.options.map((x,i)=>{const name=game.type==='find'?x.word:x[0],emoji=game.type==='find'?x.emoji:x[1];return `<button class="choice ${game.selected===i?(game.status==='correct'?'correct':'retry'):''}" data-choice="${i}" ${game.status==='correct'?'disabled':''} aria-label="${name}"><span class="picture" aria-hidden="true">${emoji}</span><span>${name}</span></button>`;}).join('')}</div>`;
case 'phrase':return `<div class="scene-picture" role="img" aria-label="${item.words.join(' ')}">${item.scene}</div><div class="phrase-slots" aria-label="Собранная фраза">${item.words.map((_,i)=>`<button class="phrase-slot ${game.answers[i]!==undefined?'filled':''}" data-slot="${i}" aria-label="${game.answers[i]!==undefined?'Убрать слово '+game.options[game.answers[i]]:'Слово '+(i+1)}" ${game.answers[i]===undefined||game.status==='correct'?'disabled':''}>${game.answers[i]!==undefined?esc(game.options[game.answers[i]]):['Кто?','Что делает?','Что?'][i]}</button>`).join('')}</div><div class="word-bank">${game.options.map((w,i)=>`<button class="word-btn ${game.answers.includes(i)?'used':''}" data-word="${i}" ${game.answers.includes(i)||game.status==='correct'?'disabled':''}>${esc(w)}</button>`).join('')}</div>`;
case 'repeat':return `<div class="say-pic" aria-hidden="true">${item[1]}</div><div class="syllable-big">${item[0]}</div><p class="say-task">${item[2]}</p><p class="repeat-sub">Можно тихо, можно громко.<br>И обязательно — в своём темпе.</p><button class="btn secondary" data-action="syllable-repeat">${icon('sound',17)} По слогам</button>`;
case 'clap':return `<div class="say-pic" aria-hidden="true">${item[1]}</div><div class="say-task">${item[0]}</div><button class="clap-circle" data-action="clap" aria-label="Хлопнуть один раз" ${game.status==='correct'?'disabled':''}>👏</button><div class="clap-dots" aria-label="Хлопков: ${game.claps}">${Array.from({length:Math.max(4,game.claps)},(_,i)=>`<span class="clap-dot ${i<game.claps?'on':''}"></span>`).join('')}</div><p class="small muted">${game.showSample?item[2].join(' · '):`Нажали ${game.claps} ${plural(game.claps,'раз','раза','раз')}`}</p>`;
case 'actions':return `<div class="scene-picture" style="font-size:66px">${item.emoji}</div><p class="story-question">${esc(item.who)}…</p><div class="choices compact-choices">${game.options.map((x,i)=>`<button class="choice ${game.selected===i?(game.status==='correct'?'correct':'retry'):''}" data-choice="${i}">${esc(x)}</button>`).join('')}</div><p class="adult-whisper">Скажи целиком: «${esc(item.phrase)}»</p>`;
case 'where':return `${positionPicture(item)}<div class="choices compact-choices">${game.options.map((x,i)=>`<button class="choice ${game.selected===i?(game.status==='correct'?'correct':'retry'):''}" data-choice="${i}">${esc(x)}</button>`).join('')}</div>`;
case 'many':return `<div class="scene-picture" style="flex-direction:column"><div style="font-size:64px">${item[2]} → ${item[2].repeat(game.quantity)}</div><p class="small muted">Один предмет и несколько предметов</p></div><div class="choices compact-choices">${game.options.map((x,i)=>`<button class="choice" data-choice="${i}">${esc(x)}</button>`).join('')}</div>`;
case 'opposite':return `<div class="scene-picture">${item[2]} <strong>${esc(item[0])}</strong> ${item[3]} <strong>?</strong></div><div class="choices compact-choices">${game.options.map((x,i)=>`<button class="choice" data-choice="${i}">${esc(x)}</button>`).join('')}</div>`;
case 'sequence':return `<p class="small muted">Нажми сначала на первую картинку, потом на вторую и третью.</p><div class="sequence-slots">${[0,1,2].map((_,i)=>`<button class="phrase-slot ${game.answers[i]!==undefined?'filled':''}" data-slot="${i}" ${game.answers[i]===undefined||game.status==='correct'?'disabled':''}>${game.answers[i]!==undefined?esc(game.options[game.answers[i]].label):i+1}</button>`).join('')}</div><div class="sequence-choice-grid">${game.options.map((x,i)=>`<button class="choice" data-sequence="${i}" ${game.answers.includes(i)||game.status==='correct'?'disabled':''}><span class="picture">${x.emoji}</span><span>${esc(x.label)}</span></button>`).join('')}</div>${game.showSample?`<div class="story-sample">${esc(item.story)}</div>`:''}`;
case 'dialogue':return `<div class="story-scene"><span>${item.scene}</span></div><h2 class="story-question">${esc(item.turns[game.index][0])}</h2>${game.showSample?`<div class="story-sample">${esc(item.turns[game.index][1])}</div>`:''}<button class="show-example" data-action="sample">${game.showSample?'Послушать пример':'Послушать вариант ответа'}</button><p class="adult-whisper">После вопроса подождите ${Math.round(voicePreferences.pause/100)/10} секунды или дольше. Дайте ребёнку ответить своим способом.</p>`;
case 'story':return `<div class="story-scene" role="img" aria-label="${esc(item.intro)}">${item.scene.map(x=>`<span aria-hidden="true">${x}</span>`).join('')}</div><h2 class="story-question">${item.qs[game.index][0]}</h2>${game.showSample?`<div class="story-sample">${item.qs[game.index][1]}</div>`:''}<button class="show-example" data-action="sample">${game.showSample?'Послушать пример ещё раз':'Подсказка для взрослого'}</button>`;}}
function roundActions(){if(game.status==='correct')return `<button class="btn primary" data-action="next">${game.index===game.total-1?'Готово!':'Дальше'} ${icon('arrow',17)}</button>`;if(['repeat','story','dialogue'].includes(game.type))return `<button class="btn secondary" data-action="prompt">${icon('sound',18)} Ещё послушать</button><button class="btn primary" data-action="spoken">${icon('check',18)} ${game.type==='repeat'?'Попробовали!':'Рассказали!'}</button>`;if(game.type==='sequence')return `<button class="btn secondary" data-action="phrase-reset">${icon('refresh',17)} Сначала</button><button class="btn primary" data-action="sequence-check" ${game.answers.length!==3?'disabled':''}>Проверить ${icon('check',18)}</button>`;if(game.type==='phrase')return `<button class="btn secondary" data-action="phrase-reset">${icon('refresh',17)} Сначала</button><button class="btn primary" data-action="phrase-check" ${game.answers.length<3?'disabled':''}>Проверить ${icon('check',18)}</button>`;if(game.type==='clap')return `<button class="btn secondary" data-action="clap-reset">${icon('refresh',17)} Сначала</button><button class="btn primary" data-action="clap-check" ${game.claps===0?'disabled':''}>Проверить ${icon('check',18)}</button><button class="show-example" data-action="clap-hint">Послушать по слогам</button>`;return `<button class="btn secondary" data-action="prompt">${icon('sound',18)} Ещё послушать</button>`;}
function adultHint(){if(game.type==='repeat')return 'Для взрослого: произнесите вместе. «Попробовали» отмечает участие, приложение не оценивает произношение.';if(game.type==='dialogue')return 'Для взрослого: задайте вопрос и дайте ребёнку свободно ответить. Нет единственного правильного ответа.';if(game.type==='sequence')return 'Называйте: сначала, потом, затем. Пусть ребёнок расскажет свою историю.';if(['actions','where','many','opposite'].includes(game.type))return 'После выбора попросите произнести весь ответ. Ошибки исправляйте мягко, повторяя правильную фразу.';if(game.type==='story')return state.age===3?'Для взрослого: достаточно одного слова. Мягко расширьте ответ: «Заяц» → «На полянку пришёл заяц».':'Для взрослого: дайте время ответить. Подойдёт свой вариант истории. Приложение не записывает голос.';if(game.type==='animals')return 'После ответа предложите ребёнку тоже сказать «мяу» или «му». Здесь звучат голосовые подражания животным.';if(game.type==='clap')return 'Произносите слово медленно. На каждый слог — один хлопок или одно нажатие. Подсказка всегда рядом.';if(game.type==='phrase')return 'Нажимайте на слова по порядку. Чтобы убрать слово, нажмите на него в собранной фразе.';return state.age===3?'Покажите картинки и назовите каждую. Затем попросите ребёнка выбрать нужную.':'После ответа можно спросить: «Какого цвета? Где живёт? Что делает?»';}
function markCorrect(message,spoken=false){if(!game||game.status==='correct')return;game.status='correct';game.feedback=message;game.solved++;state.rounds++;if(spoken)state.spoken++;save();render();}
function choose(i){if(!game||game.status==='correct'||!game.options[i])return;game.selected=i;if(['actions','where','many','opposite'].includes(game.type)){const target=game.type==='actions'?game.item.verb:game.type==='where'?game.item.where:game.item[1];if(game.options[i]===target){const sentence=game.type==='actions'||game.type==='where'?game.item.phrase:game.type==='many'?`Один ${game.item[0]}, много ${game.item[1]}.`:`${game.item[0]} — ${game.item[1]}.`;markCorrect('Правильно! Теперь скажем вместе.');speak(sentence);}else{game.status='retry';game.feedback='Не страшно! Посмотри ещё раз.';render();speak(roundPrompt());}return;}const target=game.type==='find'?game.item.word:game.item[0],choice=game.type==='find'?game.options[i].word:game.options[i][0];if(choice===target){const msg=game.type==='find'?`Да, это ${choice.toLowerCase()}!`:`Верно! ${game.item[0]} говорит «${game.item[2].toLowerCase()}».`;markCorrect(msg);speak(game.type==='animals'?msg+' Повтори вместе со мной.':msg);}else{game.status='retry';game.feedback='Попробуем ещё раз. Послушай слово.';render();speak(roundPrompt());}}
function phraseCheck(){if(game.answers.length!==3||game.status==='correct')return;const answer=game.answers.map(i=>game.options[i]);if(answer.every((x,i)=>x===game.item.words[i])){markCorrect('Вот и целое предложение! Скажем его вместе.');speak(game.item.words.join(' ')+'.');}else{game.status='retry';game.feedback='Начнём с того, кто на картинке. Можно переставить слова.';render();speak('Посмотри, кто на картинке. Поставь это слово первым.');}}
function sequenceCheck(){if(!game||game.type!=='sequence'||game.answers.length!==3)return;const selection=game.answers.map(i=>game.options[i].order);if(selection.every((x,i)=>x===i)){game.showSample=true;markCorrect('Отлично! Получилась история.');speak(game.item.story);}else{game.feedback='Давай посмотрим, с чего всё началось.';game.status='retry';game.showSample=true;render();speak(game.item.story);}}
function nextRound(){if(!game||game.status!=='correct')return;stopSpeech();if(game.index<game.total-1){game.index++;makeRound();render();window.scrollTo({top:0,behavior:'instant'});speak(roundPrompt());}else finishGame();}
function finishGame(){if(!game||game.finished)return;game.finished=true;state.games++;state.stars+=3;state.days=unique([...state.days,dayKey()]);state.gameTypes=unique([...state.gameTypes,game.type]);if(guided){guided.index++;state.today={date:dayKey(),steps:Math.max(state.today.date===dayKey()?state.today.steps:0,guided.index)};}save();render();window.scrollTo({top:0,behavior:'instant'});confetti();speak(guided&&guided.index<3?'Отлично! Ещё один маленький шаг пройден.':'Здорово! Мы поиграли и узнали столько нового. Давай обнимемся!');}

function reportVoiceProblem(code, detail=''){

}

function soundCheck(){
 // Local offline WAV makes it possible to distinguish a muted page from an absent TTS engine.
 const sampleRate=16000, samples=4000, buf=new ArrayBuffer(44+samples*2),v=new DataView(buf);
 const str=(i,s)=>{for(let j=0;j<s.length;j++)v.setUint8(i+j,s.charCodeAt(j));};
 str(0,'RIFF');v.setUint32(4,36+samples*2,true);str(8,'WAVE');str(12,'fmt ');
 v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
 str(36,'data');v.setUint32(40,samples*2,true);
 for(let i=0;i<samples;i++){const envelope=Math.sin(Math.PI*i/samples)**2;v.setInt16(44+i*2,Math.round(Math.sin(i*2*Math.PI*570/sampleRate)*6500*envelope),true);}
 const blob=new Blob([buf],{type:'audio/wav'}),url=URL.createObjectURL(blob);const a=new Audio(url);
 a.onended=()=>{URL.revokeObjectURL(url);speechAudioTested=true;toast('Если услышали короткий сигнал — динамик работает. Для речи нужен русский голос или MP3-пакет.');};
 a.onerror=()=>{URL.revokeObjectURL(url);reportVoiceProblem('audio-blocked','Проверка динамика не удалась.');};
 a.play().catch(e=>{URL.revokeObjectURL(url);reportVoiceProblem('audio-blocked',String(e?.message||''));});
}

 case 'number-reset':counted=[];render();speak('Посчитаем ещё раз.');break;
 case 'prompt':speak(roundPrompt());break;
 case 'next':nextRound();break;
 case 'spoken':if(game&&!game.finished&&['repeat','story','dialogue'].includes(game.type)){markCorrect(game.type==='repeat'?'Здорово, что попробовали!':'Спасибо за твой ответ!',true);speak(game.type==='repeat'?'Здорово, что попробовали!':'Как интересно! Давай дальше.');}break;
 case 'phrase-check':if(game?.type==='phrase')phraseCheck();break;case 'sequence-check':sequenceCheck();break;
 case 'phrase-reset':if(game){game.answers=[];game.feedback='';game.status='';render();}break;
 case 'clap':if(game?.type==='clap'&&game.status!=='correct'){game.claps=Math.min(6,game.claps+1);game.feedback='';game.status='';render();speak(NUMBERS[game.claps]);}break;
 case 'clap-reset':if(game){game.claps=0;game.feedback='';game.status='';render();}break;
 case 'clap-check':if(game?.type==='clap'&&game.claps>0){if(game.claps===game.item[2].length){markCorrect(`Получилось! ${game.item[2].join(' · ')} — ${game.claps} ${plural(game.claps,'слог','слога','слогов')}.`);speak(`${game.item[0]}. ${game.claps} ${plural(game.claps,'слог','слога','слогов')}.`);}else{game.status='retry';game.feedback='Давай послушаем слово по частям и попробуем снова.';game.showSample=true;render();speak(game.item[2].join('. ')+'.');}}break;
 case 'clap-hint':if(game?.type==='clap'){game.showSample=true;render();speak(game.item[2].join('. ')+'.');}break;
 case 'sample':if(game?.type==='story'){game.showSample=true;render();speak(game.item.qs[game.index][1]);}else if(game?.type==='dialogue'){game.showSample=true;render();speak(game.item.turns[game.index][1],false,{role:'finik'});}break;
 case 'syllable-repeat':if(game?.type==='repeat')speak(game.item[0].replace(/-/g,'. ')+'.',true,{role:'finik',rate:.83});break;
 case 'listen-syllables':speakPractice('собака');break;
 case 'studio-listen':{const x=VOICE_MANIFEST[Number(el.dataset.idx)];if(x)speak(x.text,true,{role:studioRole});break;}
 case 'studio-check':{const x=VOICE_MANIFEST[Number(el.dataset.idx)];if(x)updateVoiceReview(x.text,studioRole,true);break;}
 case 'studio-problem':{const x=VOICE_MANIFEST[Number(el.dataset.idx)];if(x)updateVoiceReview(x.text,studioRole,false);break;}
 case 'studio-replace':{const x=VOICE_MANIFEST[Number(el.dataset.idx)];if(x){studioReplaceText=x.text;document.getElementById('studio-replacement')?.click();}break;}
 case 'studio-prev':studioPage=Math.max(0,studioPage-1);render();break;
 case 'studio-next':studioPage++;render();break;
 case 'quality-test23':runAudioAudit23();break;case 'quality-export23':exportAudioAudit23();break;case 'practice-prev23':setPractice23(-1);break;case 'practice-next23':setPractice23(1);break;case 'practice-full23':sayPractice23('full');break;case 'practice-slow23':sayPractice23('slow');break;case 'practice-syllables23':sayPractice23('syllables');break;case 'practice-record23':go('record');beginRecording();break;case 'qa-export':exportQA();break;case 'backup-progress':backupProgress();break;case 'restore-progress-pick':document.getElementById('progress-import-file')?.click();break;
 case 'voice-try-device':voicePreferences.allowSystemVoice=true;saveVoicePreferences();{const opt=document.getElementById('system-voice-opt');if(opt)opt.checked=true;}speak('Привет! Я Финик. Давай вместе говорить и играть!',true);toast('Включён резервный голос устройства. Это не встроенный офлайн-нейроголос.');break;
 case 'voice-show-offline':{const help=document.getElementById('offline-voice-steps');if(help){help.open=true;help.scrollIntoView({behavior:'smooth',block:'center'});}break;}
 case 'voice-proof24':{const text='Привет! Я Финик. Давай вместе говорить.';if(clipFor(text,'finik'))speak(text,true,{role:'finik',rate:.94});else {toast('Натуральная запись приветствия ещё не создана. Соберите полный аудиопакет.');go('parents');}break;}
 case 'retry-audio':{const p=pendingAudio24;if(p)speak(p.text,true,p.options);else closeAudioOverlay24();break;}
 case 'close-audio-overlay':closeAudioOverlay24();pendingAudio24=null;break;
 case 'cache-voices24':cacheAllVoiceAudio24();break;
 case 'soundcheck':soundCheck();break;case 'refresh-voice-list':refreshVoices();updateVoiceHealth();toast('Список русских голосов обновлён.');break;case 'voicepack-pick':document.getElementById('voicepack-file')?.click();break;case 'voicepack-clear':clearAudioPack();break;case 'record-example':speak(RECORD_SAMPLES[recordPrompt],true);break;case 'record-start':beginRecording();break;case 'record-stop':stopRecording();break;case 'record-play':if(recordUrl){const a=$('audio');if(a)a.play().catch(()=>toast('Не удалось воспроизвести запись.'));}break;case 'record-delete':deleteRecording();break;case 'test-voice':speak('Привет! Я лисёнок Финик. Давай играть, слушать и говорить вместе.',true);break;
 case 'download':downloadHTML();break;
 case 'reset-dialog':showReset();break;
 case 'close-dialog':closeDialog();break;
 case 'reset-confirm':stopSpeech();state=defaults();selectedLetter=0;selectedNumber=3;counted=[];save();$('#dialog-root').innerHTML='';render();toast('Можно начинать новые открытия.');break;
 }
});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='voicepack-file'){importVoicePack(el.files?.[0]);el.value='';return;}
 if(el.id==='studio-replacement'){importIndividualClip(el.files?.[0]);el.value='';return;}
 if(el.id==='progress-import-file'){restoreProgress(el.files?.[0]);el.value='';return;}
 if(el.id==='practice-word23'){practiceIndex23=Math.max(0,Math.min(PRACTICE_23.length-1,Number(el.value)||0));render();return;}if(el.id==='speaker-role'){studioRole=el.value;render();return;}
 if(el.id==='studio-category'){studioFilter=el.value;studioPage=0;render();return;}
 if(el.id==='system-voice-opt'){voicePreferences.allowSystemVoice=el.checked;saveVoicePreferences();updateVoiceHealth();toast(el.checked?'Системная озвучка разрешена как запасная.':'Для отсутствующих MP3 голос устройства отключён.');return;}if(el.id==='primary-role'){voicePreferences.activeRole=el.value;saveVoicePreferences();speak('Привет! Я помогу тебе отвечать на вопросы.',true);return;}
 if(el.id==='dialogue-auto'){voicePreferences.autoDialogue=el.checked;saveVoicePreferences();return;}if(el.id==='sound-setting'){state.sound=el.checked;save();if(!state.sound)stopSpeech();updateChrome();}if(el.id==='voice-select'){state.voice=el.value;save();speak('Послушай мой голос. Давай говорить вместе!',true);}});
document.addEventListener('input',event=>{if(event.target.id==='studio-search'){studioSearch=event.target.value;studioPage=0;const sel=event.target.selectionStart;render();const input=document.getElementById('studio-search');input?.focus();try{input?.setSelectionRange(sel,sel);}catch{}return;}if(event.target.id==='pause-setting'){voicePreferences.pause=Number(event.target.value);saveVoicePreferences();document.getElementById('pause-label').textContent=(voicePreferences.pause/1000).toFixed(2).replace(/\.00$/,'')+' сек.';return;}if(event.target.id==='dict-search'){dictionaryQuery=event.target.value;const wrap=$('.dictionary-grid');if(wrap){const items=dictionaryFilter();wrap.innerHTML=items.map(x=>`<button class="dict-card" data-dict="${BIG_WORDS.indexOf(x)}"><span class="dict-emoji">${x.emoji}</span><b>${esc(stressed(x.word))}</b><span class="small muted">${esc(x.phrase)}</span><span class="listen-hint">${icon('sound',15)} Послушать</span></button>`).join('');}return;}if(event.target.id==='rate-setting'){state.rate=Number(event.target.value);save();$('#rate-label').textContent=rateLabel();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){$('#dialog-root').innerHTML?closeDialog():stopSpeech();}const dialog=$('.dialog');if(event.key==='Tab'&&dialog){const buttons=$$('button',dialog),first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
window.addEventListener('popstate',()=>{const p=location.hash.slice(1);go(['home','alphabet','numbers','games','dictionary','record','progress','parents'].includes(p)?p:'home',false);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
window.addEventListener('pagehide',()=>{stopSpeech();pauseRecording();if(recordUrl)URL.revokeObjectURL(recordUrl);save();});
if('speechSynthesis' in window){window.speechSynthesis.addEventListener('voiceschanged',refreshVoices);refreshVoices();}
setInterval(()=>{if(document.hidden||!activityStarted||breakShown)return;if(Date.now()-sessionStart>state.sessionMinutes*60000){breakShown=true;toast('Мы уже немного поиграли. Можно обняться и продолжить игру без экрана ♡');}},15000);
$('#side-fox').innerHTML=foxSvg()+'<b>Привет, я Финик!</b><p>Радуюсь каждому<br>твоему открытию.</p>';
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
restoreAudioPack();const initial=location.hash.slice(1);if(['home','alphabet','numbers','games','dictionary','record','progress','parents'].includes(initial))currentPage=initial;render();

window.Govorim={voice22:{manifestCount:VOICE_MANIFEST.length,syllableSpeech,normalizePack,clipFor,voiceClipCount,stress:STRESS,preferences:voicePreferences},ALPHABET,NUMBERS,WORDS,PHRASES,REPEAT,CLAPS,STORIES,GAME_META,plural,getState:()=>JSON.parse(JSON.stringify(state)),getGame:()=>game?JSON.parse(JSON.stringify(game)):null};
