plugins { id 'com.android.application' }

def tmdbKey = System.getenv('TMDB_API_KEY') ?: ''
if (!tmdbKey.isEmpty() && !(tmdbKey ==~ /[a-fA-F0-9]{32}/)) {
    throw new GradleException('TMDB_API_KEY must be an API key v3 (32 hexadecimal characters).')
}

android {
    buildFeatures { buildConfig true }
    namespace 'ru.moolva.kino'
    compileSdk 35
    defaultConfig { applicationId 'ru.moolva.kino'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.3' }
    defaultConfig { buildConfigField 'String', 'TMDB_API_KEY', '"' + tmdbKey + '"' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}

